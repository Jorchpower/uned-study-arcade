    // --- RENDERIZADO RECURSIVO DEL ÁRBOL SEMÁNTICO (NODO A NODO) ---
    function renderNodeSubtree(game, nodeId) {
      const node = game.nodes[nodeId];
      if (!node) return '';

      // Si este nodo es ancla colapsada de una rama/subárbol cerrado
      if (node.collapsed && isSubtreeFullyClosed(game.nodes, nodeId)) {
        const closedLeaves = getLeavesInSubtree(game.nodes, nodeId);
        const label = closedLeaves.length === 1
          ? `× Cerrada (${closedLeaves[0].closedReason})`
          : `× Cerradas (${closedLeaves.length} ramas)`;
        return `
          <div class="flex flex-col items-center anim-node-pop">
            <button onclick="SoundEngine.tap(); AppState.game.nodes['${node.id}'].collapsed = false; render();" class="btn-game px-2.5 py-2 rounded-2xl bg-emerald-500/15 border border-emerald-400/50 text-emerald-300 flex flex-col items-center gap-0.5 shadow-sm max-w-[130px]">
              <span class="formula-text text-[11px] font-extrabold leading-tight text-center">${esc(label)}</span>
              <span class="text-[9px] text-emerald-400/80 underline mt-0.5">Tocar para ver</span>
            </button>
          </div>
        `;
      }

      const isLeaf = node.children.length === 0;
      const isSelected = game.selectedLiteralId === node.id;
      const isHighlighted = game.highlightedIds.includes(node.id);
      const saturated = isLeaf && !game.isAcademy && isLeafOpenSaturated(game.nodes, node.id);

      // Borde izquierdo codificado por tipo de regla (Cyan α / Violet β / Slate-Sky literal)
      let leftAccent = 'border-l-[3.5px] border-l-sky-400/60';
      let badgeTag = '';
      if (node.ruleType === 'alpha') {
        leftAccent = 'border-l-[3.5px] border-l-cyan-400';
        badgeTag = node.expanded ? '' : `<span class="text-[9px] font-extrabold px-1.5 py-0.5 rounded bg-cyan-500/15 text-cyan-300 shrink-0">α</span>`;
      } else if (node.ruleType === 'beta') {
        leftAccent = 'border-l-[3.5px] border-l-violet-400';
        badgeTag = node.expanded ? '' : `<span class="text-[9px] font-extrabold px-1.5 py-0.5 rounded bg-violet-500/20 text-violet-300 shrink-0">β</span>`;
      }

      // Estilo del estado del nodo
      let cardCls = 'bg-surface/95 border-slate-700/80 text-white hover:border-slate-500';
      if (node.expanded) {
        cardCls = 'bg-slate-900/60 border-slate-800/90 text-slate-400 opacity-70';
      } else if (isSelected) {
        cardCls = 'bg-amber-500/20 border-amber-400 text-amber-100 shadow-[0_0_16px_rgba(245,158,11,0.45)] scale-[1.03]';
      } else if (node.branchClosed) {
        cardCls = 'bg-emerald-950/35 border-emerald-500/50 text-emerald-200';
      } else if (node.ruleType === 'literal') {
        cardCls = 'bg-[#142038] border-sky-500/35 text-sky-100 hover:border-amber-400/70';
      }

      const sparkCls = node.justClosed ? 'anim-close-spark' : '';
      const hlCls = isHighlighted ? 'anim-hint-glow' : '';

      // Contenido del nodo
      const nodeButton = `
        <button onclick="handleNodeTap('${node.id}')" class="btn-game relative rounded-xl border ${leftAccent} px-3 py-2 flex items-center justify-between gap-2 transition-all min-w-[86px] max-w-[235px] ${cardCls} ${sparkCls} ${hlCls}">
          <span class="formula-text text-[12.5px] font-bold leading-snug text-left break-words ${node.expanded ? 'line-through decoration-slate-600' : ''}">${esc(node.formulaStr)}</span>
          ${node.expanded
            ? `<span class="text-[11px] font-black text-emerald-400 shrink-0">✓</span>`
            : node.ruleType === 'literal'
              ? isSelected
                ? `<span class="text-[10px] font-black text-amber-300 shrink-0">●</span>`
                : ''
              : badgeTag
          }
        </button>
      `;

      // Pie de hoja (cerrada o abierta saturada)
      let leafBadge = '';
      if (isLeaf && node.branchClosed) {
        const anchor = findCollapseAnchor(game.nodes, node.id);
        const canCollapse = anchor && anchor.parentId !== null;
        leafBadge = `
          <div class="mt-1.5 flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-500/15 border border-emerald-400/45 text-emerald-300 text-[10px] font-extrabold">
            <span>× ${esc(node.closedReason)}</span>
            ${canCollapse ? `<button onclick="SoundEngine.tap(); AppState.game.nodes['${anchor.id}'].collapsed = true; render();" class="text-emerald-200/80 underline ml-1">Plegar</button>` : ''}
          </div>
        `;
      } else if (saturated) {
        const satHl = game.highlightedIds.includes(`sat_${node.id}`);
        leafBadge = `
          <button onclick="openCountermodelExtractor('${node.id}')" class="btn-game mt-2 px-3 py-2 rounded-xl bg-gradient-to-r from-violet-600 to-fuchsia-600 border border-violet-300/50 text-white text-[10.5px] font-extrabold shadow-lg shadow-violet-950/60 anim-saturated-pulse ${satHl ? 'anim-hint-glow' : ''}">
            Rama saturada (Abierta) ✓
          </button>
        `;
      }

      // Render de hijos
      let childrenHtml = '';
      if (node.children.length === 1) {
        const child = game.nodes[node.children[0]];
        const lineCls = child && child.isRoot ? 'tree-v-line-neutral' : 'tree-v-line';
        childrenHtml = `
          <div class="${lineCls}"></div>
          ${renderNodeSubtree(game, node.children[0])}
        `;
      } else if (node.children.length === 2) {
        childrenHtml = `
          <div class="tree-fork-stem"></div>
          <div class="tree-split-row">
            ${node.children.map((cid) => {
              const childNode = game.nodes[cid];
              const compact = childNode && childNode.collapsed && isSubtreeFullyClosed(game.nodes, cid);
              return `
                <div class="tree-split-branch ${compact ? 'flex-none' : 'flex-1'}">
                  ${renderNodeSubtree(game, cid)}
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      return `
        <div class="flex flex-col items-center anim-node-pop">
          ${nodeButton}
          ${leafBadge}
          ${childrenHtml}
        </div>
      `;
    }

    // --- BOTTOM ACTION SHEET PARA EXPANDIR FÓRMULA (3–4 OPCIONES) ---
    function renderExpansionSheet(game) {
      const sheet = game.expansionSheet;
      if (!sheet) return '';
      const isAlpha = sheet.node.ruleType === 'alpha';

      return `
        <div class="fixed inset-0 z-40 flex items-end justify-center bg-slate-950/75 backdrop-blur-[2px]" onclick="AppState.game.expansionSheet = null; render();">
          <div onclick="event.stopPropagation()" class="anim-sheet-up w-full max-w-[440px] rounded-t-3xl bg-[#10182B] border-t border-x border-slate-700/80 p-4 pb-6 shadow-2xl max-h-[82vh] overflow-y-auto thin-scroll">
            <div class="w-10 h-1 bg-slate-700 rounded-full mx-auto mb-3"></div>

            <div class="flex items-start justify-between gap-2 mb-3">
              <div>
                <div class="flex items-center gap-2">
                  <span class="text-[10px] font-extrabold uppercase tracking-wider px-2 py-0.5 rounded-full ${isAlpha ? 'bg-cyan-500/15 text-cyan-300 border border-cyan-400/35' : 'bg-violet-500/20 text-violet-300 border border-violet-400/35'}">
                    ${isAlpha ? 'Regla α (Vertical)' : 'Regla β (Bifurca)'}
                  </span>
                  <span class="text-[10px] text-slate-400">Elige la expansión exacta</span>
                </div>
                <div class="formula-text text-base font-extrabold text-white mt-1.5">${esc(sheet.node.formulaStr)}</div>
              </div>
              <button onclick="AppState.game.expansionSheet = null; render();" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 font-bold text-sm shrink-0">✕</button>
            </div>

            <div class="space-y-2">
              ${sheet.choices.map((ch) => {
                const isWrong = sheet.wrongChoiceId === ch.id;
                const isBranch = ch.branches.length === 2;
                return `
                  <button onclick="handleSelectExpansion('${ch.id}')" class="btn-game w-full rounded-2xl p-3 border text-left transition-all ${isWrong ? 'border-rose-500 bg-rose-500/15 anim-shake' : 'border-slate-700/80 bg-slate-900/75 hover:border-slate-500'}">
                    <div class="flex items-center justify-between mb-1.5">
                      <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">
                        ${isBranch ? 'Bifurcar en 2 ramas' : 'Apilar en vertical'}
                      </span>
                      <span class="text-xs font-mono text-slate-500">${isBranch ? '⑂' : '↓'}</span>
                    </div>

                    ${isBranch
                      ? `
                        <div class="grid grid-cols-2 gap-2">
                          ${ch.branches.map((br) => `
                            <div class="rounded-xl bg-slate-950/85 border border-slate-800 px-2.5 py-2 text-center space-y-1">
                              ${br.map((ast) => `<div class="formula-text text-xs font-bold text-slate-100">${esc(Logic.format(ast, true))}</div>`).join('')}
                            </div>
                          `).join('')}
                        </div>
                      `
                      : `
                        <div class="rounded-xl bg-slate-950/85 border border-slate-800 px-3 py-2 flex flex-col items-center gap-1">
                          ${ch.branches[0].map((ast) => `<div class="formula-text text-xs font-bold text-slate-100">${esc(Logic.format(ast, true))}</div>`).join('')}
                        </div>
                      `
                    }
                  </button>
                `;
              }).join('')}
            </div>

            ${sheet.wrongFeedback ? `
              <div class="mt-3 rounded-xl bg-rose-500/15 border border-rose-500/45 px-3 py-2.5 text-xs text-rose-200 leading-snug">
                <strong>${game.isAcademy ? '💡 Pista:' : '✕ -30 pts:'}</strong> ${esc(sheet.wrongFeedback)}
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    // --- PANTALLA FINAL: VEREDICTO O EXTRACTOR DE CONTRAMODELO ---
    function renderFinalPhase(game) {
      const fp = game.level.finalPhase;

      if (fp.type === 'verdict') {
        const fb = game.finalFeedback;
        return `
          <main class="flex-1 overflow-y-auto thin-scroll px-4 py-5 space-y-4">
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-500/20 border border-emerald-400/40 text-emerald-300 text-xs font-extrabold">
              ✓ TODAS LAS RAMAS CERRADAS
            </div>

            <div class="glass-card rounded-3xl p-4">
              <h2 class="text-base font-extrabold text-white">${esc(fp.title)}</h2>
              <p class="text-xs text-slate-300 mt-1 leading-relaxed">${esc(fp.prompt)}</p>
            </div>

            <div class="space-y-2.5">
              ${fp.options.map((opt) => `
                <button onclick="handleFinalVerdictChoice('${opt.id}')" class="btn-game w-full text-left rounded-2xl p-3.5 bg-surface border border-slate-700/80 hover:border-emerald-400/55 text-xs font-semibold text-slate-100 leading-relaxed">
                  ${esc(opt.text)}
                </button>
              `).join('')}
            </div>

            ${fb ? `
              <div class="rounded-2xl p-3.5 text-xs border ${fb.ok ? 'bg-emerald-500/15 border-emerald-400/45 text-emerald-200' : 'bg-rose-500/15 border-rose-500/45 text-rose-200'}">
                ${esc(fb.text)}
              </div>
            ` : ''}
          </main>
        `;
      }

      // Extractor de Contramodelo (Nivel 4)
      const leafId = game.saturatedLeafForFinal || getOpenLeaves(game)[0]?.id;
      const lits = leafId
        ? getPathToNode(game.nodes, leafId).filter((n) => n.ruleType === 'literal')
        : [];
      const uniqueTexts = [...new Set(lits.map((n) => n.formulaStr))];

      return `
        <main class="flex-1 overflow-y-auto thin-scroll px-4 py-4 space-y-4">
          <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-violet-500/20 border border-violet-400/40 text-violet-300 text-xs font-extrabold">
            ✦ EXTRACTOR DE CONTRAMODELO
          </div>

          <div class="glass-card rounded-3xl p-4 space-y-3 border-violet-500/35">
            <p class="text-xs text-slate-300 font-semibold">Literales de tu rama abierta saturada:</p>
            <div class="flex flex-wrap gap-2">
              ${uniqueTexts.map((t) => `
                <span class="formula-text px-3 py-1 rounded-xl bg-violet-500/20 border border-violet-400/45 text-violet-200 font-extrabold text-sm">${esc(t)}</span>
              `).join('')}
            </div>
            <p class="text-[11px] text-slate-400">Ajusta los interruptores V/F para hacer verdaderos TODOS esos literales:</p>

            <div class="space-y-2 pt-1">
              ${fp.atoms.map((atomName) => {
                const val = game.finalCountermodel[atomName];
                return `
                  <div class="flex items-center justify-between rounded-xl bg-slate-950/80 border border-slate-800 px-3.5 py-2.5">
                    <span class="formula-text text-sm font-extrabold text-white">I(${atomName}) =</span>
                    <div class="flex gap-2">
                      <button onclick="SoundEngine.tap(); AppState.game.finalCountermodel['${atomName}'] = 1; render();" class="btn-game px-3.5 py-1.5 rounded-lg text-xs font-extrabold border ${val === 1 ? 'bg-emerald-500 text-slate-950 border-emerald-300' : 'bg-slate-800 text-slate-300 border-slate-700'}">
                        V (1)
                      </button>
                      <button onclick="SoundEngine.tap(); AppState.game.finalCountermodel['${atomName}'] = 0; render();" class="btn-game px-3.5 py-1.5 rounded-lg text-xs font-extrabold border ${val === 0 ? 'bg-rose-500 text-white border-rose-300' : 'bg-slate-800 text-slate-300 border-slate-700'}">
                        F (0)
                      </button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <div class="glass-card rounded-3xl p-4 space-y-2.5">
            <p class="text-xs font-bold text-slate-100">${esc(fp.verdictPrompt)}</p>
            <div class="space-y-2">
              ${fp.verdictOptions.map((opt) => {
                const active = game.finalVerdictSelected === opt.id;
                return `
                  <button onclick="SoundEngine.tap(); AppState.game.finalVerdictSelected = '${opt.id}'; render();" class="btn-game w-full text-left rounded-xl p-3 border text-xs font-medium leading-snug ${active ? 'bg-violet-500/20 border-violet-400 text-white' : 'bg-slate-900/70 border-slate-800 text-slate-300'}">
                    ${esc(opt.text)}
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          ${game.finalFeedback ? `
            <div class="rounded-2xl p-3 text-xs bg-rose-500/15 border border-rose-500/45 text-rose-200">
              ${esc(game.finalFeedback.text)}
            </div>
          ` : ''}

          <button onclick="handleSubmitCountermodel()" class="btn-game w-full py-3.5 rounded-2xl bg-gradient-to-r from-violet-400 to-cyan-400 text-slate-950 font-extrabold text-sm shadow-lg shadow-violet-950/40">
            Confirmar Contramodelo y Veredicto
          </button>
        </main>
      `;
    }

    // --- MODAL DE VICTORIA DE CAMPAÑA ---
    function renderVictoryModal(game) {
      const st = game.victoryStats;
      if (!st) return '';
      const nextLvl = CAMPAIGN_LEVELS.find((l) => l.id === game.level.id + 1);

      return `
        <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/85 backdrop-blur-sm p-4">
          <div class="w-full max-w-[390px] glass-card rounded-3xl p-6 border-emerald-400/40 text-center shadow-2xl anim-node-pop">
            <span class="inline-flex px-3 py-1 rounded-full bg-emerald-500/15 border border-emerald-400/40 text-emerald-300 text-[11px] font-extrabold uppercase tracking-wider">
              Nivel ${game.level.id} Completado
            </span>

            <div class="flex items-center justify-center gap-3 my-4">
              ${[1, 2, 3].map((i) => `
                <div class="anim-star" style="animation-delay: ${(i - 1) * 0.14}s">
                  ${renderStarSvg(i <= st.stars, i === 2 ? 48 : 36)}
                </div>
              `).join('')}
            </div>

            <h2 class="text-xl font-black text-white">
              ${st.stars === 3 ? '¡Eficiencia de Maestro!' : st.stars === 2 ? '¡Gran razonamiento!' : '¡Prueba superada!'}
            </h2>
            <p class="text-xs text-slate-400 mt-1">
              ${st.stars === 3
                ? 'Clavaste el Par de nodos aplicando α antes que β y sin pistas de pago.'
                : st.nodesCreated > st.par
                  ? `Generaste ${st.nodesCreated} nodos (Par: ${st.par}). Aplica α antes que β para lograr 3★.`
                  : 'Supera el nivel sin errores ni pistas de pago para conseguir 3★.'
              }
            </p>

            <div class="grid grid-cols-2 gap-2 my-4 text-left">
              <div class="rounded-2xl bg-slate-900/85 border border-slate-800 p-3">
                <p class="text-[10px] uppercase text-slate-400 font-bold">Puntuación</p>
                <p class="text-lg font-black font-mono text-cyan-300">${st.finalScore} <span class="text-[10px] text-slate-400">pts</span></p>
              </div>
              <div class="rounded-2xl bg-slate-900/85 border border-slate-800 p-3">
                <p class="text-[10px] uppercase text-slate-400 font-bold">Eficiencia</p>
                <p class="text-lg font-black font-mono ${st.nodesCreated <= st.par ? 'text-emerald-400' : 'text-amber-300'}">${st.nodesCreated}<span class="text-xs text-slate-500"> / Par ${st.par}</span></p>
              </div>
              <div class="rounded-2xl bg-slate-900/85 border border-slate-800 p-3">
                <p class="text-[10px] uppercase text-slate-400 font-bold">Errores</p>
                <p class="text-base font-bold font-mono ${st.mistakes === 0 ? 'text-emerald-400' : 'text-rose-300'}">${st.mistakes}</p>
              </div>
              <div class="rounded-2xl bg-slate-900/85 border border-slate-800 p-3">
                <p class="text-[10px] uppercase text-slate-400 font-bold">Pistas pago</p>
                <p class="text-base font-bold font-mono text-slate-200">${st.paidHintsUsed}</p>
              </div>
            </div>

            <div class="space-y-2">
              ${nextLvl ? `
                <button onclick="startCampaignLevel(${nextLvl.id})" class="btn-game w-full py-3.5 rounded-2xl bg-gradient-to-r from-cyan-400 to-emerald-400 text-slate-950 font-extrabold text-sm">
                  Siguiente: ${esc(nextLvl.title)} →
                </button>
              ` : `
                <button onclick="startBugHunter()" class="btn-game w-full py-3.5 rounded-2xl bg-gradient-to-r from-rose-500 to-amber-400 text-slate-950 font-extrabold text-sm">
                  ¡Probar Cazador de Bugs! 🐛 →
                </button>
              `}
              <div class="grid grid-cols-2 gap-2">
                <button onclick="startCampaignLevel(${game.level.id})" class="btn-game py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-xs font-bold text-slate-200">
                  ↻ Repetir
                </button>
                <button onclick="goHome()" class="btn-game py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-xs font-bold text-slate-400">
                  Inicio
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // --- PANTALLA DE PARTIDA (ACADEMIA Y CAMPAÑA) ---
    function renderPlayScreen() {
      const game = AppState.game;
      const lvl = game.level;
      const backAction = game.isAcademy ? 'goAcademyMenu()' : 'goHome()';
      const grimCostLabel = game.grimorioUnlocked ? 'GRATIS' : `-${lvl.grimorioCost} pts`;
      const compassCostLabel = game.isAcademy ? 'GRATIS' : '-75 pts';

      return `
        <header class="px-3.5 py-3 border-b border-slate-800/90 bg-slate-900/95 flex items-center justify-between gap-2 shrink-0">
          <div class="flex items-center gap-2 min-w-0">
            <button onclick="${backAction}" class="btn-game w-9 h-9 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 font-bold shrink-0">←</button>
            <div class="min-w-0">
              <p class="text-[10px] font-extrabold uppercase tracking-wider ${game.isAcademy ? 'text-cyan-400' : 'text-violet-400'}">
                ${game.isAcademy ? `🎓 Academia · Lección ${lvl.id}` : `Campaña · Nivel ${lvl.id}`}
              </p>
              <h2 class="text-xs font-extrabold text-white truncate">${esc(lvl.title)}</h2>
            </div>
          </div>

          <div class="flex items-center gap-1.5 shrink-0">
            ${!game.isAcademy ? `
              <div class="px-2 py-1 rounded-xl bg-slate-800/90 border border-slate-700/75 text-center">
                <div class="text-[8px] text-slate-400 uppercase font-bold leading-none">Par</div>
                <div class="formula-text text-[11px] font-extrabold ${game.nodesCreated <= lvl.par ? 'text-emerald-400' : 'text-amber-300'}">${game.nodesCreated}/${lvl.par}</div>
              </div>
              <div class="px-2 py-1 rounded-xl bg-slate-800/90 border border-slate-700/75 text-center">
                <div class="text-[8px] text-slate-400 uppercase font-bold leading-none">Pts</div>
                <div class="formula-text text-[11px] font-extrabold text-cyan-300">${game.score}</div>
              </div>
            ` : `
              ${renderGrimorioIconBtn()}
            `}
            ${renderSoundButton()}
          </div>
        </header>

        ${game.phase === 'intro'
          ? renderAcademyIntro(game)
          : game.phase === 'phase0'
            ? renderPhase0(game)
            : game.phase === 'academy-quiz'
              ? renderAcademyLesson3Quiz(game)
              : game.phase === 'final'
                ? renderFinalPhase(game)
                : `
                  <!-- Banner de Coach (Academia) u Objetivo (Campaña) -->
                  ${game.isAcademy ? `
                    <div class="px-3.5 py-2.5 bg-gradient-to-r from-cyan-950/75 to-violet-950/60 border-b border-cyan-400/30 flex items-start gap-2.5 shrink-0">
                      <span class="text-base shrink-0 mt-0.5">🎓</span>
                      <p class="text-[11.5px] text-cyan-100 leading-snug font-medium">${esc(game.coachMessage)}</p>
                    </div>
                  ` : `
                    <div class="px-3.5 py-2 bg-slate-900/70 border-b border-slate-800/80 shrink-0">
                      <p class="text-[11px] text-slate-300 leading-snug"><span class="text-cyan-400 font-bold">Objetivo:</span> ${esc(lvl.goal)}</p>
                    </div>
                  `}

                  <!-- Banner de literal seleccionado (Cierre táctil) -->
                  ${game.selectedLiteralId ? `
                    <div class="mx-3 mt-2 px-3 py-2 rounded-xl bg-amber-500/20 border border-amber-400/55 flex items-center justify-between gap-2 shrink-0 anim-node-pop">
                      <p class="text-[11px] text-amber-100 leading-snug">
                        Seleccionado <strong class="formula-text text-amber-300">${esc(game.nodes[game.selectedLiteralId].formulaStr)}</strong>. Toca su opuesto en la <strong>misma rama</strong> para cerrar (×).
                      </p>
                      <button onclick="SoundEngine.tap(); AppState.game.selectedLiteralId = null; render();" class="px-2 py-1 rounded-lg bg-slate-950/70 text-[10px] font-bold text-slate-300 shrink-0">✕</button>
                    </div>
                  ` : ''}

                  <!-- Banner de Brújula -->
                  ${game.compassTip ? `
                    <div class="mx-3 mt-2 px-3 py-2 rounded-xl bg-amber-500/15 border border-amber-400/45 flex items-start justify-between gap-2 shrink-0 anim-node-pop">
                      <p class="text-[11px] text-amber-100 leading-snug"><strong>🧭 Brújula:</strong> ${esc(game.compassTip)}</p>
                      <button onclick="AppState.game.compassTip = null; AppState.game.highlightedIds = []; render();" class="text-amber-300 text-xs font-bold px-1">✕</button>
                    </div>
                  ` : ''}

                  <!-- Lienzo del Árbol con Zoom y Scroll suave -->
                  <div class="relative flex-1 overflow-hidden flex flex-col">
                    <!-- Controles flotantes de Zoom -->
                    <div class="absolute top-2.5 right-2.5 z-20 flex items-center gap-1 rounded-xl bg-slate-900/90 border border-slate-700/80 p-1 backdrop-blur-md shadow-lg">
                      <button onclick="adjustZoom(-0.12)" class="btn-game w-6 h-6 rounded-lg bg-slate-800 text-slate-200 text-xs font-bold flex items-center justify-center">−</button>
                      <button onclick="adjustZoom(0)" class="btn-game px-1.5 h-6 rounded-lg text-[10px] font-mono font-bold text-slate-300">${Math.round(game.zoom * 100)}%</button>
                      <button onclick="adjustZoom(0.12)" class="btn-game w-6 h-6 rounded-lg bg-slate-800 text-slate-200 text-xs font-bold flex items-center justify-center">+</button>
                    </div>

                    <main class="flex-1 overflow-auto thin-scroll px-3 pt-10 pb-12">
                      <div style="transform: scale(${game.zoom}); transform-origin: top center;" class="min-w-full w-max mx-auto flex justify-center transition-transform duration-150">
                        ${renderNodeSubtree(game, game.rootId)}
                      </div>
                    </main>
                  </div>

                  <!-- Barra inferior de Pistas (3 capas) -->
                  <footer class="px-3 py-2.5 bg-slate-900/95 border-t border-slate-800/90 grid ${game.isAcademy ? 'grid-cols-2' : 'grid-cols-3'} gap-2 shrink-0">
                    <button onclick="openGrimorio('rules')" class="btn-game rounded-xl py-2 px-2 bg-violet-500/15 border border-violet-400/35 flex flex-col items-center justify-center">
                      <span class="text-xs font-bold text-violet-200">📖 Grimorio</span>
                      <span class="text-[10px] font-mono ${game.grimorioUnlocked ? 'text-emerald-300 font-bold' : 'text-violet-300/85'}">${grimCostLabel}</span>
                    </button>
                    <button onclick="handleUseCompass()" class="btn-game rounded-xl py-2 px-2 bg-amber-500/15 border border-amber-400/35 flex flex-col items-center justify-center">
                      <span class="text-xs font-bold text-amber-200">🧭 Brújula</span>
                      <span class="text-[10px] font-mono ${game.isAcademy ? 'text-emerald-300 font-bold' : 'text-amber-300/85'}">${compassCostLabel}</span>
                    </button>
                    ${!game.isAcademy ? `
                      <button onclick="handleSolveStep()" class="btn-game rounded-xl py-2 px-2 bg-cyan-500/15 border border-cyan-400/35 flex flex-col items-center justify-center">
                        <span class="text-xs font-bold text-cyan-200">⚡ Resolver</span>
                        <span class="text-[10px] font-mono text-cyan-300/85">-150 pts</span>
                      </button>
                    ` : ''}
                  </footer>
                `
        }

        ${renderExpansionSheet(game)}
        ${game.phase === 'victory' ? renderVictoryModal(game) : ''}
        ${game.phase === 'academy-complete' ? renderAcademyCompleteModal(game) : ''}
      `;
    }

    // --- PANTALLA 4: CAZADOR DE BUGS (4 CASOS) ---
    function renderBugTree(bugCase, bugState) {
      const done = bugState.status !== 'playing';
      const clsFor = (id) => {
        if (done && id === bugCase.bugTargetId) {
          return 'border-rose-400 bg-rose-500/25 shadow-[0_0_22px_rgba(244,63,94,0.5)]';
        }
        if (bugState.wrongId === id) {
          return 'anim-shake border-slate-500 bg-surface';
        }
        return 'border-slate-700/80 bg-surface hover:border-rose-400/60';
      };

      if (bugCase.layout === 'cross-close') {
        return `
          <div class="flex flex-col items-center w-full">
            <button onclick="handleBugTap('b1_root')" class="btn-game rounded-2xl border p-3 w-full max-w-[240px] text-center ${clsFor('b1_root')}">
              <div class="text-[9px] uppercase text-slate-400 font-bold mb-1">Raíz</div>
              <div class="formula-text text-xs text-slate-400 line-through">p ∨ r ✓</div>
              <div class="formula-text text-xs text-slate-400 line-through mt-0.5">q → ¬p ✓</div>
            </button>
            <div class="tree-fork-stem"></div>
            <div class="tree-split-row">
              <div class="tree-split-branch flex-1">
                <button onclick="handleBugTap('b1_l')" class="btn-game rounded-xl border p-2.5 w-full max-w-[120px] ${clsFor('b1_l')}">
                  <div class="formula-text text-sm font-bold text-cyan-300">p</div>
                </button>
              </div>
              <div class="tree-split-branch flex-1">
                <button onclick="handleBugTap('b1_r')" class="btn-game rounded-xl border p-2 w-full max-w-[140px] ${clsFor('b1_r')}">
                  <div class="formula-text text-sm font-bold text-cyan-300">r</div>
                </button>
                <div class="tree-fork-stem"></div>
                <div class="tree-split-row">
                  <div class="tree-split-branch flex-1">
                    <button onclick="handleBugTap('b1_r1')" class="btn-game rounded-xl border p-2 ${clsFor('b1_r1')}">
                      <span class="formula-text text-xs font-bold text-sky-200">¬q</span>
                    </button>
                  </div>
                  <div class="tree-split-branch flex-1">
                    <div class="flex flex-col items-center gap-1.5">
                      <button onclick="handleBugTap('b1_r2')" class="btn-game rounded-xl border p-2 ${clsFor('b1_r2')}">
                        <span class="formula-text text-xs font-bold text-sky-200">¬p</span>
                      </button>
                      <button onclick="handleBugTap('b1_bad_close')" class="btn-game rounded-xl border px-2 py-1.5 text-[10px] font-extrabold text-emerald-300 bg-emerald-500/15 ${clsFor('b1_bad_close')}">
                        × Cerrada (p / ¬p)
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      if (bugCase.layout === 'demorgan-and-bug') {
        return `
          <div class="flex flex-col items-center w-full">
            <button onclick="handleBugTap('b2_root')" class="btn-game rounded-2xl border p-3 w-full max-w-[240px] text-center ${clsFor('b2_root')}">
              <div class="text-[9px] uppercase text-slate-400 font-bold mb-1">Raíz</div>
              <div class="formula-text text-xs text-slate-400 line-through">¬(p ∧ q) ✓</div>
              <div class="formula-text text-xs text-white font-bold mt-1">p → r</div>
            </button>
            <div class="tree-v-line"></div>
            <button onclick="handleBugTap('b2_bad_stack')" class="btn-game rounded-2xl border p-3 w-full max-w-[220px] text-center ${clsFor('b2_bad_stack')}">
              <div class="text-[10px] text-cyan-300 font-semibold mb-1">Expansión vertical de ¬(p ∧ q):</div>
              <div class="formula-text text-sm font-bold text-white">¬p</div>
              <div class="formula-text text-sm font-bold text-white mt-0.5">¬q</div>
            </button>
          </div>
        `;
      }

      if (bugCase.layout === 'neg-imp-bug') {
        return `
          <div class="flex flex-col items-center w-full">
            <button onclick="handleBugTap('b3_root')" class="btn-game rounded-2xl border p-3 w-full max-w-[240px] text-center ${clsFor('b3_root')}">
              <div class="text-[9px] uppercase text-slate-400 font-bold mb-1">Raíz</div>
              <div class="formula-text text-xs text-slate-400 line-through">¬(p → q) ✓</div>
              <div class="formula-text text-xs text-slate-400 line-through mt-0.5">q ∨ r ✓</div>
            </button>
            <div class="tree-v-line"></div>
            <button onclick="handleBugTap('b3_bad_node')" class="btn-game rounded-2xl border p-3 w-full max-w-[220px] text-center ${clsFor('b3_bad_node')}">
              <div class="text-[10px] text-cyan-300 font-semibold mb-1">Expansión de ¬(p → q):</div>
              <div class="formula-text text-sm font-bold text-white">¬p</div>
              <div class="formula-text text-sm font-bold text-white mt-0.5">q</div>
            </button>
            <div class="tree-fork-stem"></div>
            <div class="tree-split-row">
              <div class="tree-split-branch flex-1">
                <button onclick="handleBugTap('b3_l')" class="btn-game rounded-xl border p-2.5 w-full max-w-[115px] ${clsFor('b3_l')}">
                  <span class="formula-text text-sm font-bold text-sky-200">q</span>
                </button>
              </div>
              <div class="tree-split-branch flex-1">
                <button onclick="handleBugTap('b3_r')" class="btn-game rounded-xl border p-2.5 w-full max-w-[115px] ${clsFor('b3_r')}">
                  <span class="formula-text text-sm font-bold text-sky-200">r</span>
                </button>
              </div>
            </div>
          </div>
        `;
      }

      // layout === 'phase0-bug'
      return `
        <div class="flex flex-col items-center w-full">
          <div class="rounded-xl bg-violet-500/15 border border-violet-400/35 px-3 py-1.5 text-[11px] font-bold text-violet-200 mb-3">
            Enunciado: Comprobar <span class="formula-text text-white">p → q, p ⊨ q</span>
          </div>
          <div class="flex flex-col items-center gap-1.5 w-full max-w-[220px]">
            <button onclick="handleBugTap('b4_ok1')" class="btn-game w-full rounded-xl border p-2 text-center ${clsFor('b4_ok1')}">
              <span class="formula-text text-xs text-slate-400 line-through">p → q ✓</span>
            </button>
            <button onclick="handleBugTap('b4_ok2')" class="btn-game w-full rounded-xl border p-2 text-center ${clsFor('b4_ok2')}">
              <span class="formula-text text-xs font-bold text-sky-200">p</span>
            </button>
            <button onclick="handleBugTap('b4_bad_root')" class="btn-game w-full rounded-xl border p-2 text-center ${clsFor('b4_bad_root')}">
              <span class="formula-text text-xs font-bold text-white">q</span>
              <span class="text-[9px] text-slate-400 ml-1">(conclusión)</span>
            </button>
          </div>
          <div class="tree-fork-stem"></div>
          <div class="tree-split-row">
            <div class="tree-split-branch flex-1">
              <button onclick="handleBugTap('b4_l')" class="btn-game rounded-xl border p-2.5 w-full max-w-[125px] ${clsFor('b4_l')}">
                <div class="formula-text text-xs font-bold text-emerald-300">¬p  ×</div>
              </button>
            </div>
            <div class="tree-split-branch flex-1">
              <button onclick="handleBugTap('b4_r')" class="btn-game rounded-xl border p-2.5 w-full max-w-[125px] ${clsFor('b4_r')}">
                <div class="formula-text text-xs font-bold text-sky-200">q</div>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderBugScreen() {
      const bug = AppState.bug;
      if (!bug) return '';

      if (bug.status === 'summary') {
        return `
          <header class="px-4 py-3.5 border-b border-slate-800 flex items-center justify-between">
            <button onclick="goHome()" class="btn-game px-3 py-1.5 rounded-xl bg-slate-800 text-xs font-bold text-slate-300">← Inicio</button>
            <span class="text-xs font-extrabold uppercase text-rose-400">Cazador de Bugs</span>
            ${renderSoundButton()}
          </header>
          <main class="flex-1 flex flex-col items-center justify-center p-6 text-center">
            <div class="w-16 h-16 rounded-2xl bg-rose-500/20 border border-rose-400/45 flex items-center justify-center text-3xl mb-4">
              ${bug.caught === BUG_CASES.length ? '🏆' : '🐛'}
            </div>
            <h2 class="text-2xl font-black text-white">¡Ronda Terminada!</h2>
            <p class="text-xs text-slate-400 mt-1">Cazaste ${bug.caught} de ${BUG_CASES.length} errores clásicos de examen.</p>

            <div class="glass-card rounded-3xl p-4 w-full max-w-[290px] my-6 border-rose-500/30">
              <p class="text-[10px] uppercase text-slate-400 font-bold">Puntuación Total</p>
              <p class="text-3xl font-black font-mono text-rose-300 mt-1">${bug.score} <span class="text-sm text-slate-400">pts</span></p>
            </div>

            <div class="w-full max-w-[290px] space-y-2.5">
              <button onclick="startBugHunter()" class="btn-game w-full py-3.5 rounded-2xl bg-gradient-to-r from-rose-500 to-amber-400 text-slate-950 font-extrabold text-sm">
                ↻ Jugar Otra Ronda
              </button>
              <button onclick="goHome()" class="btn-game w-full py-3 rounded-2xl bg-slate-800 border border-slate-700 text-xs font-bold text-slate-200">
                Volver al Inicio
              </button>
            </div>
          </main>
        `;
      }

      const c = BUG_CASES[bug.caseIndex];
      const pct = (bug.timeLeft / 30) * 100;

      return `
        <header class="px-4 py-3 border-b border-rose-500/25 bg-slate-900/95 flex items-center justify-between gap-2 shrink-0">
          <div class="flex items-center gap-2">
            <button onclick="goHome()" class="btn-game w-9 h-9 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 font-bold">←</button>
            <div>
              <p class="text-[10px] font-extrabold uppercase tracking-wider text-rose-400">🐛 Cazador de Bugs</p>
              <h2 class="text-xs font-extrabold text-white">${esc(c.title)}</h2>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <span class="formula-text text-xs font-extrabold text-amber-300 bg-slate-800 px-2.5 py-1 rounded-xl">${bug.score} pts</span>
            ${renderSoundButton()}
          </div>
        </header>

        <div class="px-4 pt-3 pb-2.5 bg-slate-900/55 border-b border-slate-800/75 shrink-0">
          <div class="flex items-center justify-between gap-2 mb-1.5">
            <span class="text-[11px] text-slate-300 leading-tight">${esc(c.subtitle)}</span>
            <span id="bug-timer-text" class="font-mono font-bold text-cyan-300 text-sm shrink-0">${Math.ceil(bug.timeLeft)}s</span>
          </div>
          <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
            <div id="bug-timer-bar" class="h-full bg-cyan-400 transition-all duration-100 rounded-full" style="width: ${pct}%"></div>
          </div>
        </div>

        <main class="flex-1 overflow-auto thin-scroll px-3 py-5 flex flex-col justify-between">
          <div class="w-full flex justify-center">
            ${renderBugTree(c, bug)}
          </div>

          ${bug.feedback ? `
            <div class="mt-5 space-y-3 anim-node-pop">
              <div class="rounded-2xl p-3.5 text-xs leading-relaxed border ${bug.status === 'resolved' ? 'bg-emerald-500/15 border-emerald-400/45 text-emerald-200' : 'bg-rose-500/15 border-rose-500/45 text-rose-200'}">
                ${esc(bug.feedback)}
              </div>
              <button onclick="handleNextBugCase()" class="btn-game w-full py-3.5 rounded-2xl bg-gradient-to-r from-cyan-400 to-emerald-400 text-slate-950 font-extrabold text-sm">
                ${bug.caseIndex + 1 < BUG_CASES.length ? 'Siguiente Caso →' : 'Ver Resumen Final →'}
              </button>
            </div>
          ` : `
            <p class="text-center text-[11px] text-slate-500 pt-6">Toca directamente el nodo, fórmula o cierre culpable.</p>
          `}
        </main>
      `;
    }

    // --- MODAL SIEMPRE ACCESIBLE: GRIMORIO & GUÍA MAESTRA (3 PESTAÑAS) ---
    function renderGrimorioModal() {
      if (!AppState.grimorio.open) return '';

      // Si requiere confirmación de coste en Nivel 2–5
      if (AppState.grimorio.confirmPending && AppState.game) {
        const cost = AppState.game.level.grimorioCost;
        return `
          <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4" onclick="closeGrimorio()">
            <div onclick="event.stopPropagation()" class="w-full max-w-[360px] glass-card rounded-3xl p-5 border-violet-400/40 text-center anim-node-pop">
              <div class="w-12 h-12 rounded-2xl bg-violet-500/20 border border-violet-400/40 flex items-center justify-center text-2xl mx-auto mb-3">📖</div>
              <h3 class="text-base font-extrabold text-white">Abrir Grimorio en Nivel ${AppState.game.level.id}</h3>
              <p class="text-xs text-slate-300 mt-1.5 leading-relaxed">
                Desbloquear la guía en este nivel cuesta <strong class="text-amber-300 font-mono">-${cost} pts</strong> (una sola vez por intento; después podrás consultarla gratis toda la partida).
              </p>
              <div class="mt-4 space-y-2">
                <button onclick="confirmUnlockGrimorio()" class="btn-game w-full py-3 rounded-2xl bg-gradient-to-r from-violet-500 to-cyan-400 text-slate-950 font-extrabold text-xs">
                  Desbloquear Grimorio (-${cost} pts)
                </button>
                <button onclick="closeGrimorio()" class="btn-game w-full py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-xs font-bold text-slate-300">
                  Cancelar (Seguir sin pistas)
                </button>
              </div>
            </div>
          </div>
        `;
      }

      const tab = AppState.grimorio.tab;
      const tabBtn = (id, label) => `
        <button onclick="SoundEngine.tap(); AppState.grimorio.tab = '${id}'; render();" class="flex-1 py-2 px-2 rounded-xl text-[11px] font-extrabold transition-all ${tab === id ? 'bg-violet-500/25 text-white border border-violet-400/45 shadow-sm' : 'text-slate-400 hover:text-slate-200'}">
          ${label}
        </button>
      `;

      return `
        <div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-950/80 backdrop-blur-sm p-0 sm:p-4" onclick="closeGrimorio()">
          <div onclick="event.stopPropagation()" class="anim-sheet-up w-full max-w-[436px] max-h-[88vh] flex flex-col rounded-t-3xl sm:rounded-3xl bg-[#0F172A] border border-slate-700/85 shadow-2xl overflow-hidden">
            <!-- Header del Grimorio -->
            <div class="px-4 pt-4 pb-3 border-b border-slate-800 shrink-0">
              <div class="flex items-center justify-between gap-2 mb-3">
                <div>
                  <h2 class="text-base font-black text-white flex items-center gap-2">📖 Grimorio & Guía Maestra</h2>
                  <p class="text-[11px] text-slate-400">Referencia rápida de Tableaux Proposicionales</p>
                </div>
                <button onclick="closeGrimorio()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-300 font-bold text-sm">✕</button>
              </div>
              <div class="flex gap-1.5 bg-slate-950/80 p-1 rounded-2xl border border-slate-800">
                ${tabBtn('rules', 'Reglas α / β')}
                ${tabBtn('strategy', 'Estrategia')}
                ${tabBtn('exam', 'Examen (F0)')}
              </div>
            </div>

            <!-- Contenido de la pestaña activa -->
            <div class="flex-1 overflow-y-auto thin-scroll p-4 space-y-4">
              ${tab === 'rules' ? `
                <!-- TAB 1: REGLAS α Y β + DE MORGAN -->
                <section>
                  <div class="flex items-center justify-between mb-2">
                    <h3 class="text-xs font-extrabold uppercase tracking-wider text-cyan-400 flex items-center gap-1.5">
                      <span>↓</span> Reglas α · Apilan en vertical
                    </h3>
                    <span class="text-[10px] text-cyan-300/80 font-semibold">¡Hazlas primero!</span>
                  </div>
                  <div class="grid grid-cols-2 gap-2">
                    ${[
                      { label: 'Conjunción', f: 'A ∧ B', r1: 'A', r2: 'B' },
                      { label: 'Doble Negación', f: '¬¬A', r1: 'A', r2: '' },
                      { label: 'De Morgan', f: '¬(A ∨ B)', r1: '¬A', r2: '¬B' },
                      { label: 'Cond. Negado', f: '¬(A → B)', r1: 'A', r2: '¬B' }
                    ].map((item) => `
                      <div class="rounded-2xl bg-cyan-500/10 border border-cyan-400/30 p-2.5 text-center">
                        <div class="text-[9px] uppercase font-extrabold text-cyan-300/90 mb-1">${item.label}</div>
                        <div class="formula-text text-xs font-extrabold text-white pb-1.5 border-b border-cyan-400/20">${item.f}</div>
                        <div class="pt-1.5 flex flex-col items-center leading-tight">
                          <span class="formula-text text-xs font-bold text-cyan-200">${item.r1}</span>
                          ${item.r2 ? `<span class="text-[9px] text-cyan-400/70">↓</span><span class="formula-text text-xs font-bold text-cyan-200">${item.r2}</span>` : ''}
                        </div>
                      </div>
                    `).join('')}
                  </div>
                </section>

                <section>
                  <div class="flex items-center justify-between mb-2">
                    <h3 class="text-xs font-extrabold uppercase tracking-wider text-violet-400 flex items-center gap-1.5">
                      <span>⑂</span> Reglas β · Bifurcan en 2 ramas
                    </h3>
                    <span class="text-[10px] text-violet-300/80 font-semibold">Déjalas para después</span>
                  </div>
                  <div class="grid grid-cols-2 gap-2">
                    ${[
                      { label: 'Disyunción', f: 'A ∨ B', l: 'A', r: 'B' },
                      { label: 'Condicional', f: 'A → B', l: '¬A', r: 'B' },
                      { label: 'De Morgan', f: '¬(A ∧ B)', l: '¬A', r: '¬B' },
                      { label: 'Bicondicional', f: 'A ↔ B', l: 'A\nB', r: '¬A\n¬B' },
                      { label: 'Bicond. Negado', f: '¬(A ↔ B)', l: 'A\n¬B', r: '¬A\nB', full: true }
                    ].map((item) => `
                      <div class="rounded-2xl bg-violet-500/10 border border-violet-400/30 p-2.5 text-center ${item.full ? 'col-span-2' : ''}">
                        <div class="text-[9px] uppercase font-extrabold text-violet-300/90 mb-1">${item.label}</div>
                        <div class="formula-text text-xs font-extrabold text-white pb-1.5 border-b border-violet-400/20">${item.f}</div>
                        <div class="grid grid-cols-2 divide-x divide-violet-400/25 pt-1.5 formula-text text-xs font-bold text-violet-200 whitespace-pre-line leading-snug">
                          <span>${item.l}</span>
                          <span>${item.r}</span>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                </section>
              ` : tab === 'strategy' ? `
                <!-- TAB 2: ESTRATEGIA MAESTRA -->
                <div class="space-y-3">
                  <div class="rounded-2xl bg-cyan-500/10 border border-cyan-400/30 p-3.5 space-y-2">
                    <h3 class="text-xs font-extrabold text-cyan-300 uppercase">1. Regla de Oro: Siempre α antes que β</h3>
                    <p class="text-xs text-slate-200 leading-relaxed">
                      Expande todas las reglas <strong class="text-cyan-300">α (cian)</strong> disponibles antes de abrir una bifurcación <strong class="text-violet-300">β (violeta)</strong>. Así evitas copiar las mismas fórmulas en varias ramas y consigues las 3★.
                    </p>
                    <div class="rounded-xl bg-slate-950/80 p-2.5 formula-text text-[11px] text-center text-slate-300">
                      <span class="text-cyan-300">p ∧ ¬q</span> (α) → p, ¬q → luego <span class="text-violet-300">p → q</span> (β) → <span class="text-emerald-300">¬p × | q ×</span>
                    </div>
                  </div>

                  <div class="rounded-2xl bg-emerald-500/10 border border-emerald-400/30 p-3.5 space-y-1.5">
                    <h3 class="text-xs font-extrabold text-emerald-300 uppercase">2. Regla de Cierre (×)</h3>
                    <p class="text-xs text-slate-200 leading-relaxed">
                      Cierra una rama tan pronto aparezcan <span class="formula-text text-white">p</span> y <span class="formula-text text-white">¬p</span> en la <strong>misma ruta vertical hasta la raíz</strong>. Nunca cruces literales de ramas hermanas.
                    </p>
                  </div>

                  <div class="rounded-2xl bg-violet-500/10 border border-violet-400/30 p-3.5 space-y-1.5">
                    <h3 class="text-xs font-extrabold text-violet-300 uppercase">3. Rama Abierta Saturada</h3>
                    <p class="text-xs text-slate-200 leading-relaxed">
                      Cuando una rama no tiene ninguna fórmula compuesta sin expandir ni contradicciones, está <strong>saturada</strong>. Sus literales te dan directamente un modelo/contramodelo (<span class="formula-text text-white">p → V</span>, <span class="formula-text text-white">¬q → F</span>).
                    </p>
                  </div>
                </div>
              ` : `
                <!-- TAB 3: RECETARIO DE EXAMEN (FASE 0) -->
                <div class="space-y-2.5">
                  <p class="text-xs text-slate-300 leading-relaxed">
                    Guía directa para las 5 primeras preguntas del examen. Elige qué poner en la raíz según lo que te pregunten:
                  </p>
                  ${[
                    { q: '¿Es satisfacible Γ?', root: 'Γ (tal cual)', res: '1 rama abierta = SÍ · Todas × = NO' },
                    { q: '¿Es insatisfacible Γ?', root: 'Γ (tal cual)', res: 'Todas las ramas × = SÍ' },
                    { q: '¿Es tautología A?', root: '{ ¬A }', res: 'Todas × = SÍ · Abierta = Contramodelo' },
                    { q: '¿Consecuencia P₁, P₂ ⊨ C?', root: '{ P₁, P₂, ¬C }', res: 'Todas × = SÍ · Abierta = Contramodelo' },
                    { q: '¿Equivalentes A ≡ B?', root: '{ ¬(A ↔ B) }', res: 'Todas las ramas × = SÍ' }
                  ].map((row) => `
                    <div class="rounded-2xl bg-slate-900/90 border border-slate-800 p-3">
                      <div class="flex items-center justify-between gap-2">
                        <span class="text-xs font-extrabold text-white">${row.q}</span>
                        <span class="formula-text text-[11px] font-extrabold px-2 py-0.5 rounded-lg bg-violet-500/20 text-violet-200 border border-violet-400/30 shrink-0">${row.root}</span>
                      </div>
                      <p class="text-[11px] text-emerald-300/90 mt-1.5 font-medium">${row.res}</p>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>
          </div>
        </div>
      `;
    }

    // --- TOAST FLOTANTE ---
    function renderToast() {
      if (!AppState.toast) return '';
      const styles = {
        success: 'bg-emerald-950/95 border-emerald-400/65 text-emerald-100',
        error: 'bg-rose-950/95 border-rose-500/70 text-rose-100',
        warn: 'bg-amber-950/95 border-amber-400/65 text-amber-100',
        info: 'bg-slate-900/95 border-cyan-400/55 text-cyan-100'
      };
      return `
        <div class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-[calc(100%-32px)] max-w-[408px] pointer-events-none">
          <div class="rounded-2xl border px-3.5 py-2.5 text-xs font-semibold shadow-2xl backdrop-blur-md text-center leading-snug anim-node-pop ${styles[AppState.toast.type] || styles.info}">
            ${esc(AppState.toast.text)}
          </div>
        </div>
      `;
    }

    /* =========================================================================
       14. BUCLE DE RENDERIZADO PRINCIPAL
       ========================================================================= */
    function render() {
      const root = document.getElementById('app');
      if (!root) return;

      let screenHtml = '';
      if (AppState.screen === 'home') screenHtml = renderHomeScreen();
      else if (AppState.screen === 'academy-menu') screenHtml = renderAcademyMenuScreen();
      else if (AppState.screen === 'play') screenHtml = renderPlayScreen();
      else if (AppState.screen === 'bug') screenHtml = renderBugScreen();

      root.innerHTML = screenHtml + renderGrimorioModal() + renderToast();
    }

    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
</body>
</html>
