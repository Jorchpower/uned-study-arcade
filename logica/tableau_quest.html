  <style>
    /* =====================================================================
       ESTILOS PERSONALIZADOS, CONECTORES DE ÁRBOL Y MICRO-ANIMACIONES
       ===================================================================== */
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: #050811;
      color: #F1F5F9;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overscroll-behavior: none;
    }

    /* Ambiente luminoso sutil en escritorio */
    body {
      background-image:
        radial-gradient(circle at 18% 12%, rgba(34, 211, 238, 0.09), transparent 38%),
        radial-gradient(circle at 82% 86%, rgba(168, 85, 247, 0.10), transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.04), transparent 60%);
    }

    /* Contenedor móvil centrado (max 440px, edge-to-edge en móvil) */

      width: 100%;

      background: #0B1020;
      position: relative;
      overflow: hidden;
      display: flex;

    .tree-fork-stem {
      width: 2px;

      background: linear-gradient(180deg, rgba(168, 85, 247, 0.75), rgba(168, 85, 247, 0.55));

    .tree-split-row {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      position: relative;
      padding-top: 15px;
      gap: 10px;

      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      min-width: 0;
    }

    .tree-split-branch::before {
      content: '';
      position: absolute;
      top: -15px;
      height: 15px;
      width: calc(50% + 6px);
      border-top: 2px solid rgba(168, 85, 247, 0.6);

      right: -6px;
      border-left: 2px solid rgba(168, 85, 247, 0.6);

       ANIMACIONES DE JUEGO

<body>
  <div id="app" class="app-shell"></div>

  <script>
    /* =========================================================================
       1. MOTOR DE SONIDO SINTETIZADO (WEB AUDIO API)
       - Soft click, α-stack chime, β-split swoosh, branch-lock snap, error buzz,
         hint chime y victory fanfare. Sin dependencias externas.
       ========================================================================= */
    const SoundEngine = (() => {
      let ctx = null;
      let muted = false;

      function getCtx() {
        if (muted) return null;
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) ctx = new AudioCtx();
        }
        if (ctx && ctx.state === 'suspended') {
          ctx.resume().catch(() => {});
        }
        return ctx;
      }

      function tone(freq, duration, type = 'sine', vol = 0.075, delay = 0, freqEnd = null) {
        const audio = getCtx();
        if (!audio) return;
        try {
          const now = audio.currentTime + delay;
          const osc = audio.createOscillator();
          const gain = audio.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          if (freqEnd !== null) {
            osc.frequency.exponentialRampToValueAtTime(freqEnd, now + duration);
          }
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.exponentialRampToValueAtTime(vol, now + 0.014);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
          osc.connect(gain);
          gain.connect(audio.destination);
          osc.start(now);
          osc.stop(now + duration + 0.02);
        } catch (_) {}
      }

      return {
        isMuted: () => muted,
        toggleMute: () => {
          muted = !muted;
          if (!muted) tone(587.33, 0.09, 'sine', 0.055);
          return muted;
        },
        // Click suave táctil
        tap: () => tone(480, 0.055, 'triangle', 0.04, 0, 560),
        // Campanilla vertical para regla α
        alphaExpand: () => {
          tone(523.25, 0.13, 'sine', 0.07, 0);
          tone(659.25, 0.16, 'sine', 0.075, 0.065);
        },
        // Swoosh armónico para bifurcación β
        betaExpand: () => {
          tone(330, 0.18, 'triangle', 0.06, 0, 587.33);
          tone(493.88, 0.17, 'sine', 0.065, 0.05, 783.99);
        },
        // Chasquido/candado satisfactorio al cerrar rama
        branchClose: () => {
          tone(620, 0.07, 'triangle', 0.08, 0, 880);
          tone(880, 0.16, 'sine', 0.085, 0.055);
          tone(1318.5, 0.24, 'sine', 0.065, 0.11);
        },
        // Zumbido suave de error
        error: () => {
          tone(190, 0.14, 'sawtooth', 0.055, 0, 145);
          tone(150, 0.18, 'sawtooth', 0.05, 0.08, 118);
        },
        // Aviso de pista / brújula
        hint: () => {
          tone(440, 0.12, 'sine', 0.06, 0);
          tone(554.37, 0.16, 'sine', 0.065, 0.075);
        },
        // Fanfarria de victoria
        victory: () => {
          [523.25, 659.25, 783.99, 1046.5].forEach((n, i) => {
            tone(n, 0.28, 'sine', 0.08, i * 0.085);
          });
        }
      };
    })();

    /* =========================================================================
       2. MOTOR DE LÓGICA PROPOSICIONAL (PARSER RECURSIVO, AST, REGLAS α/β)
       ========================================================================= */
    const Logic = (() => {
      const atom = (name) => ({ op: 'ATOM', name });
      const not = (arg) => ({ op: 'NOT', arg });
      const bin = (op, left, right) => ({ op, left, right });

      // Tokenizador para ¬, ∧, ∨, →, ↔, paréntesis y variables proposicionales
      function tokenize(input) {
        const tokens = [];
        let i = 0;
        while (i < input.length) {
          const ch = input[i];
          if (/\s/.test(ch)) { i++; continue; }
          if ('()¬∧∨→↔'.includes(ch) || /[a-z]/.test(ch)) {
            tokens.push(ch);
            i++;
          } else {
            throw new Error('Símbolo no reconocido: ' + ch);
          }
        }
        return tokens;
      }

      // Parser descendente recursivo (precedencia estándar: ¬ > ∧ > ∨ > → > ↔)
      function parse(str) {
        const tokens = tokenize(str);
        let pos = 0;
        const peek = () => tokens[pos];
        const consume = (expected) => {
          const tok = tokens[pos];
          if (expected && tok !== expected) {
            throw new Error(`Se esperaba '${expected}', encontrado '${tok}' en ${str}`);
          }
          pos++;
          return tok;
        };

        function parseIff() {
          let left = parseImp();
          while (peek() === '↔') {
            consume('↔');
            left = bin('IFF', left, parseImp());
          }
          return left;
        }
        function parseImp() {
          let left = parseOr();
          if (peek() === '→') {
            consume('→');
            left = bin('IMP', left, parseImp());
          }
          return left;
        }
        function parseOr() {
          let left = parseAnd();
          while (peek() === '∨') {
            consume('∨');
            left = bin('OR', left, parseAnd());
          }
          return left;
        }
        function parseAnd() {
          let left = parseUnary();
          while (peek() === '∧') {
            consume('∧');
            left = bin('AND', left, parseUnary());
          }
          return left;
        }
        function parseUnary() {
          if (peek() === '¬') {
            consume('¬');
            return not(parseUnary());
          }
          if (peek() === '(') {
            consume('(');
            const inner = parseIff();
            consume(')');
            return inner;
          }
          const tok = consume();
          if (!tok || !/[a-z]/.test(tok)) {
            throw new Error('Átomo esperado cerca de ' + tok);
          }
          return atom(tok);
        }

        const ast = parseIff();
        if (pos !== tokens.length) {
          throw new Error('Tokens sobrantes en: ' + str);
        }
        return ast;
      }

      // Impresora limpia con paréntesis mínimos necesarios
      function format(ast, isRoot = true) {
        if (!ast) return '';
        if (ast.op === 'ATOM') return ast.name;
        if (ast.op === 'NOT') {
          const inner = ast.arg;
          if (inner.op === 'ATOM' || inner.op === 'NOT') {
            return '¬' + format(inner, false);
          }
          return '¬(' + format(inner, true) + ')';
        }
        const symbols = { AND: '∧', OR: '∨', IMP: '→', IFF: '↔' };
        const leftStr = format(ast.left, false);
        const rightStr = format(ast.right, false);
        const expr = `${leftStr} ${symbols[ast.op]} ${rightStr}`;
        return isRoot ? expr : `(${expr})`;
      }

      function getLiteralInfo(ast) {
        if (ast.op === 'ATOM') return { isLiteral: true, atom: ast.name, negated: false };
        if (ast.op === 'NOT' && ast.arg.op === 'ATOM') return { isLiteral: true, atom: ast.arg.name, negated: true };
        return { isLiteral: false };
      }

      function areComplementary(astA, astB) {
        const a = getLiteralInfo(astA);
        const b = getLiteralInfo(astB);
        return a.isLiteral && b.isLiteral && a.atom === b.atom && a.negated !== b.negated;
      }

      // Clasificación exacta de reglas α (verticales) y β (bifurcaciones)
      function classify(ast) {
        const lit = getLiteralInfo(ast);
        if (lit.isLiteral) return { kind: 'literal', ...lit };

        // ¬¬A  ==> α: [A]
        if (ast.op === 'NOT' && ast.arg.op === 'NOT') {
          return {
            kind: 'alpha',
            ruleName: 'Doble Negación (α)',
            branches: [[ast.arg.arg]],
            summary: `Eliminamos la doble negación de ${format(ast)} → ${format(ast.arg.arg)}.`
          };
        }
        // A ∧ B ==> α: [A, B]
        if (ast.op === 'AND') {
          return {
            kind: 'alpha',
            ruleName: 'Conjunción (α)',
            branches: [[ast.left, ast.right]],
            summary: `Para que A ∧ B sea verdadera, AMBAS deben cumplirse en la misma rama (α vertical).`
          };
        }
        // ¬(A ∨ B) ==> α: [¬A, ¬B] (De Morgan)
        if (ast.op === 'NOT' && ast.arg.op === 'OR') {
          const { left, right } = ast.arg;
          return {
            kind: 'alpha',
            ruleName: 'De Morgan · ¬(A ∨ B) (α)',
            branches: [[not(left), not(right)]],
            summary: `Por De Morgan, ¬(A ∨ B) equivale a ¬A ∧ ¬B: ambos se apilan en vertical (α).`
          };
        }
        // ¬(A → B) ==> α: [A, ¬B]
        if (ast.op === 'NOT' && ast.arg.op === 'IMP') {
          const { left, right } = ast.arg;
          return {
            kind: 'alpha',
            ruleName: 'Condicional Negado (α)',
            branches: [[left, not(right)]],
            summary: `Un condicional solo es falso si el antecedente es V (A) y el consecuente F (¬B): regla α.`
          };
        }
        // A ∨ B ==> β: [A] | [B]
        if (ast.op === 'OR') {
          return {
            kind: 'beta',
            ruleName: 'Disyunción (β)',
            branches: [[ast.left], [ast.right]],
            summary: `Basta con que uno de los dos sea verdadero: bifurca en 2 ramas (β).`
          };
        }
        // A → B ==> β: [¬A] | [B]
        if (ast.op === 'IMP') {
          return {
            kind: 'beta',
            ruleName: 'Condicional (β)',
            branches: [[not(ast.left)], [ast.right]],
            summary: `A → B equivale a ¬A ∨ B: bifurca en ¬A a la izquierda y B a la derecha (β).`
          };
        }
        // ¬(A ∧ B) ==> β: [¬A] | [¬B] (De Morgan)
        if (ast.op === 'NOT' && ast.arg.op === 'AND') {
          const { left, right } = ast.arg;
          return {
            kind: 'beta',
            ruleName: 'De Morgan · ¬(A ∧ B) (β)',
            branches: [[not(left)], [not(right)]],
            summary: `Por De Morgan, ¬(A ∧ B) equivale a ¬A ∨ ¬B: bifurca en ¬A | ¬B (β).`
          };
        }
        // A ↔ B ==> β: [A, B] | [¬A, ¬B]
        if (ast.op === 'IFF') {
          return {
            kind: 'beta',
            ruleName: 'Bicondicional (β)',
            branches: [[ast.left, ast.right], [not(ast.left), not(ast.right)]],
            summary: `A ↔ B exige valores iguales: bifurca en [A, B] por un lado y [¬A, ¬B] por el otro (β).`
          };
        }
        // ¬(A ↔ B) ==> β: [A, ¬B] | [¬A, B]
        if (ast.op === 'NOT' && ast.arg.op === 'IFF') {
          const { left, right } = ast.arg;
          return {
            kind: 'beta',
            ruleName: 'Bicondicional Negado (β)',
            branches: [[left, not(right)], [not(left), right]],
            summary: `¬(A ↔ B) exige valores opuestos: bifurca en [A, ¬B] y [¬A, B] (β).`
          };
        }

        throw new Error('Fórmula no soportada: ' + format(ast));
      }

      // Firma canónica para asegurar que no haya opciones repetidas en el selector
      function choiceSignature(choice) {
        return choice.kind + '::' + choice.branches.map((br) => br.map((a) => format(a, true)).join(',')).join('|');
      }

      // Generador de 3–4 opciones plausibles con trampas clásicas de examen
      function generateExpansionChoices(ast) {
        const info = classify(ast);
        const correct = {
          id: 'correct',
          isCorrect: true,
          kind: info.kind,
          branches: info.branches,
          explanation: info.summary
        };

        const rawTraps = [];

        if (ast.op === 'NOT' && ast.arg.op === 'NOT') {
          const A = ast.arg.arg;
          rawTraps.push({
            kind: 'alpha',
            branches: [[not(A)]],
            explanation: '¡Ojo! Dos negaciones (¬¬) se cancelan entre sí, dejando la fórmula positiva.'
          });
          rawTraps.push({
            kind: 'beta',
            branches: [[A], [not(A)]],
            explanation: 'La doble negación es regla α (vertical); nunca abre dos ramas.'
          });
        } else if (ast.op === 'AND') {
          rawTraps.push({
            kind: 'beta',
            branches: [[ast.left], [ast.right]],
            explanation: '¡Confusión clásica! A ∧ B requiere AMBOS verdaderos en la misma rama (α vertical), no bifurcar.'
          });
          rawTraps.push({
            kind: 'alpha',
            branches: [[not(ast.left), not(ast.right)]],
            explanation: 'No hay negación delante de A ∧ B: conserva ambos términos sin negar.'
          });
        } else if (ast.op === 'NOT' && ast.arg.op === 'OR') {
          const { left, right } = ast.arg;
          rawTraps.push({
            kind: 'beta',
            branches: [[not(left)], [not(right)]],
            explanation: '¡Trampa de De Morgan! ¬(A ∨ B) cambia ∨ por ∧ (¬A ∧ ¬B): es α vertical, ¡no bifurca!'
          });
          rawTraps.push({
            kind: 'alpha',
            branches: [[left, not(right)]],
            explanation: 'De Morgan reparte la negación a LOS DOS términos: ¬A y ¬B.'
          });
          rawTraps.push({
            kind: 'alpha',
            branches: [[left, right]],
            explanation: 'Has olvidado aplicar la negación externa con De Morgan.'
          });
        } else if (ast.op === 'NOT' && ast.arg.op === 'IMP') {
          const { left, right } = ast.arg;
          rawTraps.push({
            kind: 'beta',
            branches: [[not(left)], [right]],
            explanation: 'Esa es la regla de A → B sin negar. Aquí tenemos ¬(A → B), que es α vertical: A y ¬B.'
          });
          rawTraps.push({
            kind: 'alpha',
            branches: [[not(left), right]],
            explanation: '¡Al revés! Un condicional es falso cuando el antecedente es V (A) y el consecuente F (¬B).'
          });
          rawTraps.push({
            kind: 'alpha',
            branches: [[not(left), not(right)]],
            explanation: 'Para hacer falso A → B, el antecedente A debe permanecer VERDADERO y solo B se niega.'
          });
        } else if (ast.op === 'OR') {
          rawTraps.push({
            kind: 'alpha',
            branches: [[ast.left, ast.right]],
            explanation: 'La disyunción (∨) es regla β: basta que se cumpla uno, así que debe bifurcar en 2 ramas.'
          });
          rawTraps.push({
            kind: 'beta',
            branches: [[not(ast.left)], [ast.right]],
            explanation: 'No niegues el primer término; esa es la regla del condicional (→), no de la disyunción (∨).'
          });
        } else if (ast.op === 'IMP') {
          rawTraps.push({
            kind: 'beta',
            branches: [[ast.left], [ast.right]],
            explanation: '¡Error muy frecuente! A → B equivale a ¬A ∨ B: el antecedente va NEGADO en la rama izquierda.'
          });
          rawTraps.push({
            kind: 'alpha',
            branches: [[not(ast.left), ast.right]],
            explanation: 'El condicional es regla β (bifurca en ¬A | B), no α vertical.'
          });
          rawTraps.push({
            kind: 'beta',
            branches: [[ast.left], [not(ast.right)]],
            explanation: 'Has negado el lado equivocado: se niega el antecedente (¬A), no el consecuente.'
          });
        } else if (ast.op === 'NOT' && ast.arg.op === 'AND') {
          const { left, right } = ast.arg;
          rawTraps.push({
            kind: 'alpha',
            branches: [[not(left), not(right)]],
            explanation: '¡Trampa de De Morgan! ¬(A ∧ B) cambia ∧ por ∨ (¬A ∨ ¬B): es regla β y DEBE bifurcar.'
          });
          rawTraps.push({
            kind: 'beta',
            branches: [[left], [not(right)]],
            explanation: 'De Morgan niega ambos términos: ¬A por un lado y ¬B por el otro.'
          });
          rawTraps.push({
            kind: 'beta',
            branches: [[left], [right]],
            explanation: 'Has olvidado negar ambos lados al aplicar De Morgan.'
          });
        } else if (ast.op === 'IFF') {
          rawTraps.push({
            kind: 'beta',
            branches: [[ast.left, not(ast.right)], [not(ast.left), ast.right]],
            explanation: 'Esas ramas son del bicondicional NEGADO. Sin negar, ambos términos deben coincidir en valor.'
          });
          rawTraps.push({
            kind: 'alpha',
            branches: [[ast.left, ast.right]],
            explanation: 'A ↔ B también es verdadero cuando ambos son falsos (¬A, ¬B); necesita bifurcar.'
          });
          rawTraps.push({
            kind: 'beta',
            branches: [[ast.left], [ast.right]],
            explanation: 'Cada rama del bicondicional lleva el par completo: [A, B] o [¬A, ¬B].'
          });
        } else if (ast.op === 'NOT' && ast.arg.op === 'IFF') {
          const { left, right } = ast.arg;
          rawTraps.push({
            kind: 'beta',
            branches: [[left, right], [not(left), not(right)]],
            explanation: 'Al estar negado, los lados deben tener valores OPUESTOS: [A, ¬B] o [¬A, B].'
          });
          rawTraps.push({
            kind: 'alpha',
            branches: [[left, not(right)]],
            explanation: '¬(A ↔ B) puede ser verdadero de dos formas opuestas: necesita bifurcar (β).'
          });
          rawTraps.push({
            kind: 'beta',
            branches: [[not(left)], [not(right)]],
            explanation: 'Cada rama del bicondicional negado exige un par opuesto: [A, ¬B] y [¬A, B].'
          });
        }

        // Deduplicar y quedarnos con 3–4 opciones
        const seen = new Set([choiceSignature(correct)]);
        const finalChoices = [correct];
        let trapIdx = 1;
        for (const t of rawTraps) {
          const sig = choiceSignature(t);
          if (!seen.has(sig) && finalChoices.length < 4) {
            seen.add(sig);
            finalChoices.push({ ...t, id: `trap_${trapIdx++}`, isCorrect: false });
          }
        }

        // Barajar opciones
        for (let i = finalChoices.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [finalChoices[i], finalChoices[j]] = [finalChoices[j], finalChoices[i]];
        }
        return finalChoices;
      }

      return { parse, format, getLiteralInfo, areComplementary, classify, generateExpansionChoices };
    })();

          return {
            completedLessons: Array.isArray(parsed.completedLessons) ? parsed.completedLessons : [],
            stars: parsed.stars || {},
            bestScore: parsed.bestScore || {},
            bugBestScore: parsed.bugBestScore || 0,
            bugCleared: !!parsed.bugCleared
          };
        }
      } catch (_) {}
      return {
        completedLessons: [],
        stars: {},
        bestScore: {},
        bugBestScore: 0,
        bugCleared: false

    let uidCounter = 1;
    const nextId = (prefix = 'n') => `${prefix}_${uidCounter++}`;

    function showToast(text, type = 'info', duration = 3000) {
      if (AppState.toastTimer) clearTimeout(AppState.toastTimer);
      AppState.toast = { text, type };
      render();
      AppState.toastTimer = setTimeout(() => {
        AppState.toast = null;
        render();
      }, duration);
    }

    /* =========================================================================
       5. MOTOR DE ÁRBOL SEMÁNTICO (NODO INDIVIDUAL POR FÓRMULA, AUTO-PLEGADO)
       ========================================================================= */
    function createFormulaNode(ast, parentId, isRoot = false) {
      const info = Logic.classify(ast);
      return {
        id: nextId('nd'),
        parentId,
        formulaAst: ast,
        formulaStr: Logic.format(ast, true),
        expanded: false,
        ruleType: info.kind, // 'alpha' | 'beta' | 'literal'
        isRoot,
        children: [],
        branchClosed: false,
        closedPairIds: null,
        closedReason: null,
        justClosed: false,
        collapsed: false,
        locked: false // usado en lección preconstruida
      };
    }

    // Construye una cadena vertical inicial con las fórmulas de la raíz
    function buildRootChain(rawFormulas) {
      const nodes = {};
      let rootId = null;
      let prevId = null;
      rawFormulas.forEach((raw) => {
        const ast = Logic.parse(raw);
        const node = createFormulaNode(ast, prevId, true);
        nodes[node.id] = node;
        if (!rootId) rootId = node.id;
        if (prevId) nodes[prevId].children.push(node.id);
        prevId = node.id;
      });
      return { nodes, rootId };
    }

    // Construye el árbol prefabricado de la Lección 3 de Academia
    function buildLesson3PrebuiltTree() {
      const nodes = {};
      const nRoot = createFormulaNode(Logic.parse('p'), null, true);
      const nLeft1 = createFormulaNode(Logic.parse('¬p'), nRoot.id, false);
      const nLeft2 = createFormulaNode(Logic.parse('q'), nLeft1.id, false);
      const nRight1 = createFormulaNode(Logic.parse('¬q'), nRoot.id, false);
      const nRight2 = createFormulaNode(Logic.parse('r'), nRight1.id, false);

      nRoot.children = [nLeft1.id, nRight1.id];
      nLeft1.children = [nLeft2.id];
      nRight1.children = [nRight2.id];

      [nRoot, nLeft1, nLeft2, nRight1, nRight2].forEach((n) => {
        nodes[n.id] = n;
      });

      return {
        nodes,
        rootId: nRoot.id,
        ids: { p: nRoot.id, notP: nLeft1.id, q: nLeft2.id, notQ: nRight1.id, r: nRight2.id }
      };
    }

    // Camino desde la raíz hasta nodeId
    function getPathToNode(nodes, nodeId) {
      const path = [];
      let curr = nodes[nodeId];
      while (curr) {
        path.unshift(curr);
        curr = curr.parentId ? nodes[curr.parentId] : null;
      }
      return path;
    }

    // Hojas en el subárbol de startId
    function getLeavesInSubtree(nodes, startId) {
      const leaves = [];
      function dfs(id) {
        const n = nodes[id];
        if (!n) return;
        if (n.children.length === 0) leaves.push(n);
        else n.children.forEach(dfs);
      }
      dfs(startId);
      return leaves;
    }

    // Todas las hojas abiertas del árbol
    function getOpenLeaves(game) {
      return getLeavesInSubtree(game.nodes, game.rootId).filter((l) => !l.branchClosed);
    }

    // Comprueba si ancestorId es ancestro de targetId (o igual)
    function isAncestorOrSelf(nodes, ancestorId, targetId) {
      let curr = nodes[targetId];
      while (curr) {
        if (curr.id === ancestorId) return true;
        curr = curr.parentId ? nodes[curr.parentId] : null;
      }
      return false;
    }

    // Fórmulas compuestas sin expandir en la ruta hasta leafId
    function getUnexpandedCompoundsOnPath(nodes, leafId) {
      return getPathToNode(nodes, leafId).filter(
        (n) => n.ruleType !== 'literal' && !n.expanded
      );
    }

    // Busca contradicción entre literales en la ruta hasta leafId
    function findContradictionOnPath(nodes, leafId) {
      const lits = getPathToNode(nodes, leafId).filter((n) => n.ruleType === 'literal');
      for (let i = 0; i < lits.length; i++) {
        for (let j = i + 1; j < lits.length; j++) {
          if (Logic.areComplementary(lits[i].formulaAst, lits[j].formulaAst)) {
            return [lits[i], lits[j]];
          }
        }
      }
      return null;
    }

    // ¿Está una hoja abierta, sin compuestas pendientes y sin contradicciones?
    function isLeafOpenSaturated(nodes, leafId) {
      const leaf = nodes[leafId];
      if (!leaf || leaf.branchClosed) return false;
      if (getUnexpandedCompoundsOnPath(nodes, leafId).length > 0) return false;
      return findContradictionOnPath(nodes, leafId) === null;
    }

    // Comprueba si todo el subárbol bajo nodeId está cerrado
    function isSubtreeFullyClosed(nodes, nodeId) {
      const leaves = getLeavesInSubtree(nodes, nodeId);
      return leaves.length > 0 && leaves.every((l) => l.branchClosed);
    }

    // Sube hasta el hijo de la bifurcación más alta cuyo subárbol esté 100% cerrado para plegarlo limpiamente
    function findCollapseAnchor(nodes, leafId) {
      let curr = nodes[leafId];
      let anchor = curr;
      while (curr && curr.parentId) {
        const parent = nodes[curr.parentId];
        if (!parent) break;
        if (parent.children.length === 2 && isSubtreeFullyClosed(nodes, curr.id)) {
          anchor = curr;
        }
        curr = parent;
      }
      return anchor;
    }

    // Adjunta una lista vertical de fórmulas [ast1, ast2...] bajo parentId y devuelve el último nodo
    function appendVerticalStack(nodes, parentId, astList) {
      let currParent = parentId;
      let added = 0;
      astList.forEach((ast) => {
        const newNode = createFormulaNode(ast, currParent, false);
        nodes[newNode.id] = newNode;
        nodes[currParent].children.push(newNode.id);
        currParent = newNode.id;
        added++;
      });
      return added;
    }

    // Expande un nodo compuesto en TODAS las hojas abiertas de su subárbol (regla estándar de tableaux)
    function applyNodeExpansion(game, nodeId) {
      const node = game.nodes[nodeId];
      if (!node || node.expanded || node.ruleType === 'literal') return 0;

      const openLeaves = getLeavesInSubtree(game.nodes, nodeId).filter((l) => !l.branchClosed);
      if (openLeaves.length === 0) return 0;

      const info = Logic.classify(node.formulaAst);
      let newNodesCount = 0;

      openLeaves.forEach((leaf) => {
        if (info.kind === 'alpha') {
          newNodesCount += appendVerticalStack(game.nodes, leaf.id, info.branches[0]);
        } else {
          // Regla β: bifurca en 2 ramas (cada rama puede llevar 1 o 2 fórmulas apiladas, ej. bicondicional)
          info.branches.forEach((branchAsts) => {
            const topNode = createFormulaNode(branchAsts[0], leaf.id, false);
            game.nodes[topNode.id] = topNode;
            leaf.children.push(topNode.id);
            newNodesCount += 1;
            if (branchAsts.length > 1) {
              newNodesCount += appendVerticalStack(game.nodes, topNode.id, branchAsts.slice(1));
            }
          });
        }
      });

      node.expanded = true;
      game.nodesCreated += newNodesCount;
      game.highlightedIds = [];
      game.compassTip = null;
      return newNodesCount;
    }

    /* =========================================================================
       6. INICIO DE LECCIÓN DE ACADEMIA O NIVEL DE CAMPAÑA
       ========================================================================= */
    function startAcademyLesson(lessonId) {
      const lesson = ACADEMY_LESSONS.find((l) => l.id === lessonId);
      if (!lesson) return;
      SoundEngine.tap();

      let nodes = {};
      let rootId = null;
      let prebuiltIds = null;

      if (lesson.mode === 'prebuilt-close') {
        const built = buildLesson3PrebuiltTree();
        nodes = built.nodes;
        rootId = built.rootId;
        prebuiltIds = built.ids;
      } else {
        const built = buildRootChain(lesson.rootFormulas);
        nodes = built.nodes;
        rootId = built.rootId;
      }

      let phase0Data = null;
      if (lesson.phase0) {
        const opts = [...lesson.phase0.options];
        for (let i = opts.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [opts[i], opts[j]] = [opts[j], opts[i]];
        }
        phase0Data = { ...lesson.phase0, options: opts };
      }

      AppState.game = {
        isAcademy: true,
        lesson,
        level: {
          id: lesson.id,
          title: lesson.title,
          goal: lesson.coachIntro,
          par: 99,
          grimorioCost: 0
        },
        phase: 'intro', // 'intro' | 'phase0' | 'tree' | 'academy-quiz' | 'academy-complete'
        phase0Data,
        phase0Feedback: null,
        nodes,
        rootId,
        prebuiltIds,
        zoom: 1,
        score: 0,
        nodesCreated: 0,
        mistakes: 0,
        paidHintsUsed: 0,
        solveStepUsed: false,
        grimorioUnlocked: true,
        selectedLiteralId: null,
        expansionSheet: null,
        highlightedIds: [],
        compassTip: null,
        coachMessage: lesson.coachIntro,
        lesson3QuizAnswered: false,
        lesson3QuizWrong: false
      };

      AppState.screen = 'play';
      updateAcademyCoachGuide(AppState.game);
      render();
    }

    function startCampaignLevel(levelId) {
      const level = CAMPAIGN_LEVELS.find((l) => l.id === levelId);
      if (!level) return;
      SoundEngine.tap();

      const { nodes, rootId } = buildRootChain(level.rootFormulas);

      let phase0Data = null;
      if (level.phase0) {
        const opts = [...level.phase0.options];
        for (let i = opts.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [opts[i], opts[j]] = [opts[j], opts[i]];
        }
        phase0Data = { ...level.phase0, options: opts };
      }

      AppState.game = {
        isAcademy: false,
        level,
        phase: level.phase0 ? 'phase0' : 'tree', // 'phase0' | 'tree' | 'final' | 'victory'
        phase0Data,
        phase0Feedback: null,
        nodes,
        rootId,
        zoom: 1,
        score: 300,
        streak: 0,
        nodesCreated: 0,
        mistakes: 0,
        paidHintsUsed: 0,
        solveStepUsed: false,
        grimorioUnlocked: level.grimorioCost === 0,
        selectedLiteralId: null,
        expansionSheet: null,
        highlightedIds: [],
        compassTip: null,
        saturatedLeafForFinal: null,
        finalCountermodel: { p: null, q: null, r: null, s: null },
        finalVerdictSelected: null,
        finalFeedback: null,
        victoryStats: null
      };

      AppState.screen = 'play';
      render();
    }

    // Actualiza la guía luminosa y mensaje del Coach en cada paso de Academia
    function updateAcademyCoachGuide(game) {
      if (!game || !game.isAcademy) return;
      const lesson = game.lesson;

      if (lesson.mode === 'prebuilt-close') {
        const leftClosed = game.nodes[game.prebuiltIds.notP] && isSubtreeFullyClosed(game.nodes, game.prebuiltIds.notP);
        if (!leftClosed) {
          game.highlightedIds = game.selectedLiteralId === game.prebuiltIds.p
            ? [game.prebuiltIds.notP]
            : [game.prebuiltIds.p, game.prebuiltIds.notP];
          game.coachMessage = game.selectedLiteralId === game.prebuiltIds.p
            ? '¡Eso es! Ahora toca ¬p en la rama izquierda para cerrarla (×).'
            : 'Toca p (en la raíz) y luego ¬p (en la rama izquierda) para cerrar por contradicción.';
        } else {
          game.highlightedIds = [];
          game.phase = 'academy-quiz';
        }
        return;
      }

      const step = computeOptimalStep(game);
      if (!step) return;

      if (lesson.mode === 'guided-open') {
        if (step.action === 'expand') {
          game.highlightedIds = [step.nodeId];
          const fStr = game.nodes[step.nodeId].formulaStr;
          game.coachMessage = `Toca ${fStr} (regla α) y elige cómo se apila en vertical.`;
        } else if (step.action === 'saturated') {
          completeAcademyLesson(game);
        }
      } else if (lesson.mode === 'guided-beta') {
        const openLeaves = getOpenLeaves(game);
        const anyUnexpanded = openLeaves.some((l) => getUnexpandedCompoundsOnPath(game.nodes, l.id).length > 0);
        if (!anyUnexpanded) {
          completeAcademyLesson(game);
        } else if (step.action === 'expand') {
          game.highlightedIds = [step.nodeId];
          const fStr = game.nodes[step.nodeId].formulaStr;
          game.coachMessage = `Toca ${fStr} (regla β) y selecciona cómo bifurca el árbol en 2 ramas.`;
        }
      } else if (lesson.mode === 'enforce-alpha-first') {
        if (step.action === 'expand') {
          game.highlightedIds = [step.nodeId];
          const n = game.nodes[step.nodeId];
          if (n.ruleType === 'alpha') {
            game.coachMessage = `Regla de Oro: haz primero la fórmula α (${n.formulaStr}) para no duplicar trabajo.`;
          } else {
            game.coachMessage = `¡Genial! Ya tienes p y ¬q arriba. Ahora expande la β (${n.formulaStr}) y verás qué rápido se cierra todo.`;
          }
        } else if (step.action === 'close') {
          game.highlightedIds = [step.litA.id, step.litB.id];
          game.coachMessage = `¡Casi listo! Toca ${step.litA.formulaStr} y ${step.litB.formulaStr} en esa misma rama para cerrarla (×).`;
        }
      } else if (lesson.mode === 'exam-mini') {
        if (step.action === 'expand') {
          game.highlightedIds = [step.nodeId];
          game.coachMessage = `Expande ${game.nodes[step.nodeId].formulaStr} (α) para sacar sus literales.`;
        } else if (step.action === 'close') {
          game.highlightedIds = [step.litA.id, step.litB.id];
          game.coachMessage = `¡Contradicción a la vista! Empareja ${step.litA.formulaStr} con ${step.litB.formulaStr} para cerrar la rama.`;
        }
      }
    }

    function completeAcademyLesson(game) {
      if (!game.isAcademy) return;
      const lid = game.lesson.id;
      if (!AppState.progress.completedLessons.includes(lid)) {
        AppState.progress.completedLessons.push(lid);
        saveProgress(AppState.progress);
      }
      game.highlightedIds = [];
      game.phase = 'academy-complete';
      SoundEngine.victory();
      render();
    }

    /* =========================================================================
       7. ASESOR ÓPTIMO (BRÚJULA ESTRATÉGICA Y RESOLVER PASO)
       ========================================================================= */
    function computeOptimalStep(game) {
      const openLeaves = getOpenLeaves(game);
      if (openLeaves.length === 0) return null;

      // 1. Contradicción lista para cerrar
      for (const leaf of openLeaves) {
        const pair = findContradictionOnPath(game.nodes, leaf.id);
        if (pair) {
          return {
            action: 'close',
            leafId: leaf.id,
            litA: pair[0],
            litB: pair[1],
            highlightIds: [pair[0].id, pair[1].id],
            tip: `¡Contradicción disponible! Toca ${pair[0].formulaStr} y luego ${pair[1].formulaStr} en la misma rama para cerrarla.`,
            autoNote: `Cerramos la rama automáticamente al emparejar ${pair[0].formulaStr} con ${pair[1].formulaStr}.`
          };
        }
      }

      // 2. Priorizar siempre reglas α (verticales) sobre β
      const allPendingAlpha = [];
      const allPendingBeta = [];
      const seen = new Set();

      openLeaves.forEach((leaf) => {
        getUnexpandedCompoundsOnPath(game.nodes, leaf.id).forEach((n) => {
          if (seen.has(n.id)) return;
          seen.add(n.id);
          if (n.ruleType === 'alpha') allPendingAlpha.push(n);
          else allPendingBeta.push(n);
        });
      });

      if (allPendingAlpha.length > 0) {
        const chosen = allPendingAlpha[0];
        return {
          action: 'expand',
          nodeId: chosen.id,
          highlightIds: [chosen.id],
          tip: `Estrategia óptima: expande primero la regla α ${chosen.formulaStr} antes de abrir bifurcaciones.`,
          autoNote: `Aplicada regla α sobre ${chosen.formulaStr}: ${Logic.classify(chosen.formulaAst).summary}`
        };
      }

      if (allPendingBeta.length > 0) {
        const chosen = allPendingBeta[0];
        return {
          action: 'expand',
          nodeId: chosen.id,
          highlightIds: [chosen.id],
          tip: `No quedan reglas α pendientes. Expande ${chosen.formulaStr} (regla β) para continuar.`,
          autoNote: `Aplicada regla β sobre ${chosen.formulaStr}: ${Logic.classify(chosen.formulaAst).summary}`
        };
      }

      // 3. Si no hay nada por expandir ni contradicciones -> rama abierta saturada
      const satLeaf = openLeaves.find((l) => isLeafOpenSaturated(game.nodes, l.id));
      if (satLeaf) {
        return {
          action: 'saturated',
          leafId: satLeaf.id,
          highlightIds: [`sat_${satLeaf.id}`],
          tip: '¡Esta rama está saturada sin contradicciones! Pulsa "Rama saturada (Abierta) ✓" para extraer el contramodelo.',
          autoNote: 'Rama abierta saturada detectada: pasamos al extractor de contramodelo.'
        };
      }

      return null;
    }

    /* =========================================================================
       8. INTERACCIONES DEL JUGADOR EN EL ÁRBOL Y MODALES
       ========================================================================= */
    function handleNodeTap(nodeId) {
      const game = AppState.game;
      if (!game || game.phase !== 'tree') return;
      const node = game.nodes[nodeId];
      if (!node) return;

      // --- A) TOCAR UN LITERAL (p, ¬p...) ---
      if (node.ruleType === 'literal') {
        const openUnder = getLeavesInSubtree(game.nodes, nodeId).filter((l) => !l.branchClosed);
        if (openUnder.length === 0) {
          showToast('Este literal pertenece a una rama ya cerrada.', 'info', 1800);
          return;
        }

        // Seleccionar primer literal
        if (!game.selectedLiteralId) {
          SoundEngine.tap();
          game.selectedLiteralId = nodeId;
          if (game.isAcademy) updateAcademyCoachGuide(game);
          render();
          return;
        }

        // Deseleccionar si toca el mismo
        if (game.selectedLiteralId === nodeId) {
          SoundEngine.tap();
          game.selectedLiteralId = null;
          if (game.isAcademy) updateAcademyCoachGuide(game);
          render();
          return;
        }

        const first = game.nodes[game.selectedLiteralId];
        const second = node;

        // 1. Verificar que sean complementarios
        if (!Logic.areComplementary(first.formulaAst, second.formulaAst)) {
          SoundEngine.error();
          if (!game.isAcademy) {
            game.score = Math.max(0, game.score - 20);
            game.mistakes += 1;
            game.streak = 0;
          }
          game.selectedLiteralId = null;
          showToast(`No se contradicen (${first.formulaStr} y ${second.formulaStr}). Busca la misma letra con signo opuesto.`, 'error', 2800);
          render();
          return;
        }

        // 2. Verificar que estén en la MISMA ruta vertical ancestral
        const sameBranch =
          isAncestorOrSelf(game.nodes, first.id, second.id) ||
          isAncestorOrSelf(game.nodes, second.id, first.id);

        if (!sameBranch) {
          SoundEngine.error();
          if (!game.isAcademy) {
            game.score = Math.max(0, game.score - 25);
            game.mistakes += 1;
            game.streak = 0;
          }
          game.selectedLiteralId = null;
          showToast(
            '¡Cuidado! Esos literales están en ramas distintas. Solo puedes cerrar con ancestros de la misma rama.',
            'error',
            4200
          );
          render();
          return;
        }

        // 3. ¡Cierre válido!
        executeBranchClosure(game, first, second);
        return;
      }

      // --- B) TOCAR UNA FÓRMULA COMPUESTA ---
      game.selectedLiteralId = null;

      if (node.expanded) {
        showToast('Esta fórmula ya fue expandida (✓).', 'info', 1600);
        return;
      }

      const openUnder = getLeavesInSubtree(game.nodes, nodeId).filter((l) => !l.branchClosed);
      if (openUnder.length === 0) {
        showToast('Todas las ramas bajo esta fórmula ya están cerradas.', 'info', 1800);
        return;
      }

      // En Academia Lección 4: intervenir amablemente si intenta hacer β antes de α
      if (game.isAcademy && game.lesson.mode === 'enforce-alpha-first' && node.ruleType === 'beta') {
        const openLeaves = getOpenLeaves(game);
        const alphaPending = openLeaves.some((l) =>
          getUnexpandedCompoundsOnPath(game.nodes, l.id).some((n) => n.ruleType === 'alpha')
        );
        if (alphaPending) {
          SoundEngine.error();
          game.coachMessage = '¡Espera! Tienes una regla α (p ∧ ¬q) disponible. Hazla primero para no duplicarla en dos ramas.';
          showToast('¡Recuerda la Regla de Oro! Haz la regla α antes que la β.', 'warn', 2800);
          render();
          return;
        }
      }

      SoundEngine.tap();
      game.expansionSheet = {
        nodeId,
        node,
        choices: Logic.generateExpansionChoices(node.formulaAst),
        wrongChoiceId: null,
        wrongFeedback: null
      };
      render();
    }

    function executeBranchClosure(game, litA, litB) {
      const deeperId = isAncestorOrSelf(game.nodes, litA.id, litB.id) ? litB.id : litA.id;
      const leavesToClose = getLeavesInSubtree(game.nodes, deeperId).filter((l) => !l.branchClosed);
      if (leavesToClose.length === 0) return;

      leavesToClose.forEach((leaf) => {
        leaf.branchClosed = true;
        leaf.closedPairIds = [litA.id, litB.id];
        leaf.closedReason = `${litA.formulaStr} / ${litB.formulaStr}`;
        leaf.justClosed = true;

        // Auto-plegado del segmento cerrado tras animación de chispa
        const leafIdCopy = leaf.id;
        setTimeout(() => {
          if (!AppState.game || !AppState.game.nodes[leafIdCopy]) return;
          AppState.game.nodes[leafIdCopy].justClosed = false;
          const anchor = findCollapseAnchor(AppState.game.nodes, leafIdCopy);
          if (anchor && anchor.parentId !== null) {
            anchor.collapsed = true;
          }
          render();
        }, 880);
      });

      SoundEngine.branchClose();
      game.selectedLiteralId = null;
      game.highlightedIds = [];
      game.compassTip = null;

      if (!game.isAcademy) {
        game.score += 80 * leavesToClose.length;
        game.streak += 1;
      }

      // Evaluar estado tras cierre
      const remainingOpen = getOpenLeaves(game);

      if (game.isAcademy) {
        if (game.lesson.mode === 'prebuilt-close') {
          showToast(`¡Rama izquierda cerrada (${litA.formulaStr} / ${litB.formulaStr})!`, 'success', 2000);
          setTimeout(() => {
            if (AppState.game && AppState.game.isAcademy) {
              updateAcademyCoachGuide(AppState.game);
              render();
            }
          }, 950);
        } else if (remainingOpen.length === 0) {
          setTimeout(() => {
            if (AppState.game && AppState.game.isAcademy) completeAcademyLesson(AppState.game);
          }, 700);
        } else {
          updateAcademyCoachGuide(game);
        }
        render();
        return;
      }

      // Modo Campaña
      if (remainingOpen.length === 0) {
        setTimeout(() => {
          if (!AppState.game) return;
          if (AppState.game.level.finalPhase && AppState.game.level.finalPhase.type === 'verdict') {
            AppState.game.phase = 'final';
            render();
          } else {
            finishCampaignVictory(AppState.game);
          }
        }, 720);
      } else {
        showToast(`¡Rama cerrada (${litA.formulaStr} / ${litB.formulaStr})! +${80 * leavesToClose.length} pts`, 'success', 2100);
      }

      render();
    }

    function handleSelectExpansion(choiceId) {
      const game = AppState.game;
      if (!game || !game.expansionSheet) return;
      const choice = game.expansionSheet.choices.find((c) => c.id === choiceId);
      if (!choice) return;

      if (choice.isCorrect) {
        const targetNodeId = game.expansionSheet.nodeId;
        const kind = choice.kind;
        game.expansionSheet = null;

        if (kind === 'alpha') SoundEngine.alphaExpand();
        else SoundEngine.betaExpand();

        applyNodeExpansion(game, targetNodeId);

        if (!game.isAcademy) {
          const streakBonus = Math.min(game.streak * 15, 45);
          game.score += 60 + streakBonus;
          game.streak += 1;
          showToast(
            streakBonus > 0 ? `¡Exacto! +${60 + streakBonus} pts (racha x${game.streak})` : '¡Expansión correcta! +60 pts',
            'success',
            1650
          );
        } else {
          showToast(choice.explanation, 'success', 2400);
          updateAcademyCoachGuide(game);
        }

        render();
      } else {
        SoundEngine.error();
        if (!game.isAcademy) {
          game.score = Math.max(0, game.score - 30);
          game.mistakes += 1;
          game.streak = 0;
        }
        game.expansionSheet.wrongChoiceId = choiceId;
        game.expansionSheet.wrongFeedback = choice.explanation;
        render();
        setTimeout(() => {
          if (AppState.game && AppState.game.expansionSheet) {
            AppState.game.expansionSheet.wrongChoiceId = null;
          }
        }, 420);
      }
    }

    /* =========================================================================
       9. GRIMORIO (SIEMPRE ACCESIBLE CON 3 PESTAÑAS Y CONFIRMACIÓN EN NV. 2-5)
       ========================================================================= */
    function openGrimorio(defaultTab = 'rules') {
      SoundEngine.tap();
      AppState.grimorio.tab = defaultTab;

      // Comprobar si estamos en un nivel de campaña con coste y aún no desbloqueado
      if (
        AppState.screen === 'play' &&
        AppState.game &&
        !AppState.game.isAcademy &&
        AppState.game.phase !== 'victory' &&
        AppState.game.level.grimorioCost > 0 &&
        !AppState.game.grimorioUnlocked
      ) {
        AppState.grimorio.confirmPending = true;
      } else {
        AppState.grimorio.confirmPending = false;
      }

      AppState.grimorio.open = true;
      render();
    }

    function confirmUnlockGrimorio() {
      const game = AppState.game;
      if (!game) return;
      SoundEngine.hint();
      const cost = game.level.grimorioCost;
      game.score = Math.max(0, game.score - cost);
      game.paidHintsUsed += 1;
      game.grimorioUnlocked = true;
      AppState.grimorio.confirmPending = false;
      showToast(`Grimorio desbloqueado para este intento (-${cost} pts)`, 'warn', 2100);
      render();
    }

    function closeGrimorio() {
      SoundEngine.tap();
      AppState.grimorio.open = false;
      AppState.grimorio.confirmPending = false;
      render();
    }

    /* =========================================================================
       10. PISTAS DE PARTIDA (BRÚJULA Y RESOLVER PASO) Y CONTROLES DE ZOOM
       ========================================================================= */
    function handleUseCompass() {
      const game = AppState.game;
      if (!game || game.phase !== 'tree') return;
      const step = computeOptimalStep(game);
      if (!step) return;

      SoundEngine.hint();
      if (!game.isAcademy) {
        game.score = Math.max(0, game.score - 75);
        game.paidHintsUsed += 1;
      }
      game.highlightedIds = step.highlightIds;
      game.compassTip = step.tip;
      render();
    }

    function handleSolveStep() {
      const game = AppState.game;
      if (!game || game.phase !== 'tree') return;
      const step = computeOptimalStep(game);
      if (!step) return;

      if (!game.isAcademy) {
        game.score = Math.max(0, game.score - 150);
        game.paidHintsUsed += 1;
        game.solveStepUsed = true;
        game.streak = 0;
      }
      game.expansionSheet = null;
      game.selectedLiteralId = null;

      if (step.action === 'close') {
        executeBranchClosure(game, step.litA, step.litB);
        showToast(step.autoNote, 'info', 3200);
      } else if (step.action === 'saturated') {
        if (game.isAcademy) completeAcademyLesson(game);
        else openCountermodelExtractor(step.leafId);
      } else if (step.action === 'expand') {
        const node = game.nodes[step.nodeId];
        if (node.ruleType === 'alpha') SoundEngine.alphaExpand();
        else SoundEngine.betaExpand();
        applyNodeExpansion(game, step.nodeId);
        showToast(step.autoNote, 'info', 3400);
        if (game.isAcademy) updateAcademyCoachGuide(game);
        render();
      }
    }

    function adjustZoom(delta) {
      if (!AppState.game) return;
      SoundEngine.tap();
      if (delta === 0) AppState.game.zoom = 1;
      else AppState.game.zoom = Math.min(1.25, Math.max(0.65, +(AppState.game.zoom + delta).toFixed(2)));
      render();
    }

    /* =========================================================================
       11. FASE 0, CONTRAMODELO, VEREDICTO Y VICTORIA DE CAMPAÑA
       ========================================================================= */
    function handlePhase0Choice(optionId) {
      const game = AppState.game;
      if (!game || !game.phase0Data) return;
      const opt = game.phase0Data.options.find((o) => o.id === optionId);
      if (!opt) return;

      if (opt.correct) {
        SoundEngine.branchClose();
        if (!game.isAcademy) game.score += 75;
        game.phase0Feedback = { ok: true, text: opt.feedback };
        render();
        setTimeout(() => {
          if (AppState.game) {
            AppState.game.phase = 'tree';
            AppState.game.phase0Feedback = null;
            if (AppState.game.isAcademy) updateAcademyCoachGuide(AppState.game);
            render();
          }
        }, 1050);
      } else {
        SoundEngine.error();
        if (!game.isAcademy) {
          game.score = Math.max(0, game.score - 35);
          game.mistakes += 1;
        }
        game.phase0Feedback = { ok: false, text: opt.feedback, wrongId: optionId };
        render();
      }
    }

    function openCountermodelExtractor(leafId) {
      const game = AppState.game;
      if (!game) return;
      SoundEngine.alphaExpand();
      game.saturatedLeafForFinal = leafId;
      game.phase = 'final';
      game.finalFeedback = null;
      render();
    }

    function handleFinalVerdictChoice(optionId) {
      const game = AppState.game;
      if (!game || !game.level.finalPhase) return;
      const opt = game.level.finalPhase.options.find((o) => o.id === optionId);
      if (!opt) return;

      if (opt.correct) {
        SoundEngine.branchClose();
        game.score += 100;
        game.finalFeedback = { ok: true, text: opt.feedback };
        render();
        setTimeout(() => {
          if (AppState.game) finishCampaignVictory(AppState.game);
        }, 850);
      } else {
        SoundEngine.error();
        game.score = Math.max(0, game.score - 40);
        game.mistakes += 1;
        game.finalFeedback = { ok: false, text: opt.feedback };
        render();
      }
    }

    function handleSubmitCountermodel() {
      const game = AppState.game;
      if (!game || !game.level.finalPhase) return;
      const fp = game.level.finalPhase;

      const missing = fp.atoms.some((a) => game.finalCountermodel[a] === null);
      if (missing || !game.finalVerdictSelected) {
        SoundEngine.error();
        game.finalFeedback = {
          ok: false,
          text: 'Selecciona V (1) o F (0) para cada variable y marca el veredicto de examen.'
        };
        render();
        return;
      }

      // Validar dinámicamente contra los literales reales presentes en la rama abierta
      const pathLits = getPathToNode(game.nodes, game.saturatedLeafForFinal).filter(
        (n) => n.ruleType === 'literal'
      );
      const validAssignment = pathLits.every((litNode) => {
        const info = Logic.getLiteralInfo(litNode.formulaAst);
        const chosenVal = game.finalCountermodel[info.atom];
        return info.negated ? chosenVal === 0 : chosenVal === 1;
      });

      const verdictObj = fp.verdictOptions.find((o) => o.id === game.finalVerdictSelected);
      const verdictOk = verdictObj && verdictObj.correct;

      if (!validAssignment) {
        SoundEngine.error();
        game.score = Math.max(0, game.score - 30);
        game.mistakes += 1;
        game.finalFeedback = {
          ok: false,
          text: 'Revisa los literales de tu rama abierta: si aparece ¬p, entonces I(p)=F (0); si aparece p sin negar, I(p)=V (1).'
        };
        render();
        return;
      }

      if (!verdictOk) {
        SoundEngine.error();
        game.score = Math.max(0, game.score - 30);
        game.mistakes += 1;
        game.finalFeedback = {
          ok: false,
          text: '¡Ojo al veredicto! Al sobrevivir una rama abierta saturada hemos encontrado un contramodelo: NO es consecuencia lógica.'
        };
        render();
        return;
      }

      SoundEngine.branchClose();
      game.score += 120;
      finishCampaignVictory(game);
    }

    function finishCampaignVictory(game) {
      const { level, nodesCreated, mistakes, paidHintsUsed, solveStepUsed } = game;
      let stars = 1;
      if (!solveStepUsed && mistakes <= 1) {
        stars = 2;
      }
      if (nodesCreated <= level.par && paidHintsUsed === 0 && !solveStepUsed && mistakes === 0) {
        stars = 3;
      }

      const parBonus = nodesCreated <= level.par ? 120 : 0;
      const finalScore = Math.max(0, game.score + parBonus);
      game.score = finalScore;

      AppState.progress.stars[level.id] = Math.max(AppState.progress.stars[level.id] || 0, stars);
      AppState.progress.bestScore[level.id] = Math.max(AppState.progress.bestScore[level.id] || 0, finalScore);
      saveProgress(AppState.progress);

      game.victoryStats = {
        stars,
        finalScore,
        parBonus,
        nodesCreated,
        par: level.par,
        mistakes,
        paidHintsUsed
      };
      game.phase = 'victory';
      SoundEngine.victory();
      render();
    }

    /* =========================================================================
       12. MODO "CAZADOR DE BUGS" (4 CASOS · CONTRARRELOJ 30s)
       ========================================================================= */
    function startBugHunter() {
      clearBugTimer();
      SoundEngine.tap();
      AppState.screen = 'bug';
      AppState.bug = {
        caseIndex: 0,
        score: 0,
        combo: 0,
        caught: 0,
        timeLeft: 30,
        status: 'playing', // 'playing' | 'resolved' | 'timeout' | 'summary'
        wrongId: null,
        feedback: null,
        timerId: null
      };
      startBugCountdown();
      render();
    }

    function clearBugTimer() {
      if (AppState.bug && AppState.bug.timerId) {
        clearInterval(AppState.bug.timerId);
        AppState.bug.timerId = null;
      }
    }

    function startBugCountdown() {
      clearBugTimer();
      AppState.bug.timerId = setInterval(() => {
        if (!AppState.bug || AppState.bug.status !== 'playing') {
          clearBugTimer();
          return;
        }
        AppState.bug.timeLeft = Math.max(0, +(AppState.bug.timeLeft - 0.1).toFixed(1));
        const bar = document.getElementById('bug-timer-bar');
        const label = document.getElementById('bug-timer-text');
        if (bar && label) {
          const pct = (AppState.bug.timeLeft / 30) * 100;
          bar.style.width = `${pct}%`;
          label.textContent = `${Math.ceil(AppState.bug.timeLeft)}s`;
          if (AppState.bug.timeLeft <= 8) {
            bar.className = 'h-full bg-rose-500 transition-all duration-100 rounded-full';
            label.className = 'font-mono font-bold text-rose-400 text-sm';
          } else if (AppState.bug.timeLeft <= 15) {
            bar.className = 'h-full bg-amber-400 transition-all duration-100 rounded-full';
            label.className = 'font-mono font-bold text-amber-300 text-sm';
          }
        }
        if (AppState.bug.timeLeft <= 0) {
          clearBugTimer();
          SoundEngine.error();
          const c = BUG_CASES[AppState.bug.caseIndex];
          AppState.bug.combo = 0;
          AppState.bug.status = 'timeout';
          AppState.bug.feedback = `¡Tiempo agotado! ${c.explanation}`;
          render();
        }
      }, 100);
    }

    function handleBugTap(targetId) {
      const bug = AppState.bug;
      if (!bug || bug.status !== 'playing') return;
      const c = BUG_CASES[bug.caseIndex];

      if (targetId === c.bugTargetId) {
        clearBugTimer();
        SoundEngine.branchClose();
        bug.combo += 1;
        const pts = 100 + Math.round(bug.timeLeft * 10) + (bug.combo - 1) * 35;
        bug.score += pts;
        bug.caught += 1;
        bug.status = 'resolved';
        bug.feedback = `${c.explanation} (+${pts} pts${bug.combo > 1 ? ` · Combo x${bug.combo}` : ''})`;
        render();
      } else {
        SoundEngine.error();
        bug.timeLeft = Math.max(0, +(bug.timeLeft - 3).toFixed(1));
        bug.combo = 0;
        bug.wrongId = targetId;
        showToast('Ese paso es correcto. ¡Sigue buscando el error! (-3s)', 'error', 1800);
        render();
        setTimeout(() => {
          if (AppState.bug) AppState.bug.wrongId = null;
        }, 400);
      }
    }

    function handleNextBugCase() {
      const bug = AppState.bug;
      if (!bug) return;
      SoundEngine.tap();
      if (bug.caseIndex + 1 < BUG_CASES.length) {
        bug.caseIndex += 1;
        bug.timeLeft = 30;
        bug.status = 'playing';
        bug.feedback = null;
        bug.wrongId = null;
        startBugCountdown();
        render();
      } else {
        clearBugTimer();
        bug.status = 'summary';
        if (bug.score > AppState.progress.bugBestScore) {
          AppState.progress.bugBestScore = bug.score;
        }
        if (bug.caught === BUG_CASES.length) {
          AppState.progress.bugCleared = true;
        }
        saveProgress(AppState.progress);
        SoundEngine.victory();
        render();
      }
    }
