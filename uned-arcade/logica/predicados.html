                  <span class="badge ${info.kind === 'alpha' ? 'b-alpha' : 'b-beta'}">${esc(info.name)}</span>
                  <div class="mono" style="font-size:16px;font-weight:900;margin-top:4px">${esc(nd.f)}</div>
                </div>
                <button class="icon-btn btn" onclick="State.game.sheet=null;render()">✕</button>
              </div>
              <div class="small" style="margin-bottom:8px">Elige la expansión correcta (cuidado con las trampas de examen):</div>
              <div class="flex col g8 scroll-y">
                ${sh.choices.map((c) => {
                  const bad = sh.wrongId === c.id;
                  const txt = c.kind === 'alpha'
                    ? c.branches[0].map((x) => FOL.format(x, true)).join('   ↓   ')
                    : c.branches.map((b) => b.map((x) => FOL.format(x, true)).join(', ')).join('   |   ');
                  return `
                    <button class="row-btn btn ${bad ? 'anim-shake' : ''}" style="justify-content:space-between;${bad ? 'border-color:var(--coral);background:var(--coral-bg)' : ''}" onclick="pickPropChoice('${c.id}')">
                      <span class="mono" style="font-size:13.5px;font-weight:800">${esc(txt)}</span>
                      <span class="badge ${c.kind === 'alpha' ? 'b-alpha' : 'b-beta'}">${c.kind === 'alpha' ? 'α Apila' : 'β Bifurca'}</span>
                    </button>`;
                }).join('')}
              </div>
              ${sh.fb ? `<div class="card" style="margin-top:10px;padding:10px;font-size:12px;font-weight:700;background:var(--coral-bg);border-color:var(--coral-bd)">⚠️ ${esc(sh.fb)}</div>` : ''}
            </div>
          </div>`;
      }

      // Selector de Constantes para δ (constante nueva obligatoria) y γ (reutilizable ∞)
      const isDelta = sh.mode === 'delta';
      return `
        <div class="backdrop" onclick="if(event.target===this){State.game.sheet=null;render()}">
          <div class="sheet">
            <div class="flex aic jcb" style="margin-bottom:8px">
              <div>
                <span class="badge ${isDelta ? 'b-delta' : 'b-gamma'}">${esc(info.name)}</span>
                <div class="mono" style="font-size:16.5px;font-weight:900;margin-top:4px">${esc(nd.f)}</div>
              </div>
              <button class="icon-btn btn" onclick="State.game.sheet=null;render()">✕</button>
            </div>

            <div class="small" style="margin-bottom:10px">
              ${isDelta
                ? 'Toca una constante <strong>NUEVA</strong> que no esté en uso en esta rama para sustituir <span class="mono">' + info.v + '</span>:'
                : 'Toca la constante con la que quieres instanciar <span class="mono">' + info.v + '</span> (puedes reutilizar esta γ varias veces):'}
            </div>

            <div class="grid2" style="margin-bottom:8px">
              ${FOL.CONSTS.map((c) => {
                const inBranch = sh.bc.includes(c);
                const alreadyUsedHere = !isDelta && nd.usedConsts.includes(c);
                const preview = FOL.format(info.instantiate(c), true);

                let bd = 'var(--border-hi)', bg = 'rgba(18,28,52,0.92)', statusTxt = 'Libre', statusCol = '#94a3b8';
                if (isDelta) {
                  if (inBranch) {
                    bd = 'var(--coral-bd)'; bg = 'rgba(244,63,94,0.12)';
                    statusTxt = 'En uso en rama'; statusCol = '#fda4af';
                  } else {
                    bd = 'var(--delta-bd)'; bg = 'var(--delta-bg)';
                    statusTxt = 'Nueva ✓'; statusCol = '#fcd34d';
                  }
                } else {
                  if (alreadyUsedHere) {
                    bd = 'rgba(100,116,139,0.45)'; bg = 'rgba(15,23,42,0.65)';
                    statusTxt = 'Ya instanciada'; statusCol = '#94a3b8';
                  } else if (inBranch) {
                    bd = 'var(--gamma-bd)'; bg = 'var(--gamma-bg)';
                    statusTxt = 'En rama ★'; statusCol = '#6ee7b7';
                  } else {
                    statusTxt = 'Nueva';
                  }
                }

                return `
                  <button class="btn" style="padding:11px 10px;border-radius:14px;border:1px solid ${bd};background:${bg};text-align:left;display:flex;flex-direction:column;gap:4px" onclick="pickConstant('${c}')">

                    <div class="mono trunc w100" style="font-size:12px;color:#cbd5e1">→ ${esc(preview)}</div>
                  </button>`;
              }).join('')}
            </div>

            ${sh.deltaAlert ? `
              <div class="card anim-shake" style="padding:11px 12px;font-size:12.2px;font-weight:700;background:var(--coral-bg);border-color:var(--coral);color:#ffe4e6">
                🚨 ${esc(sh.deltaAlert)}
              </div>` : ''}
          </div>
        </div>`;
    }

    /* =========================================================================
       13. RENDERIZADO DE FORJA & MINI-MUNDOS (CON LIENZO SVG DE DOMINIO FINITO)
       ========================================================================= */
    function renderMiniWorldSVG(world) {
      const nodeMap = {};
      world.nodes.forEach((n) => { nodeMap[n.id] = n; });

      const edgesSvg = world.edges.map(([uId, vId]) => {
        const u = nodeMap[uId], v = nodeMap[vId];
        if (!u || !v) return '';
        if (uId === vId) {
          // Bucle elegante sobre el propio nodo
          return `<path d="M ${u.x + 14} ${u.y - 16} C ${u.x + 56} ${u.y - 54}, ${u.x + 58} ${u.y + 34}, ${u.x + 22} ${u.y + 10}" fill="none" stroke="#f59e0b" stroke-width="2.6" marker-end="url(#arrow-w)" />`;
        }
        const dx = v.x - u.x, dy = v.y - u.y;
        const dist = Math.hypot(dx, dy) || 1;
        const ux = dx / dist, uy = dy / dist;
        const x1 = u.x + ux * 23, y1 = u.y + uy * 23;
        const x2 = v.x - ux * 27, y2 = v.y - uy * 27;
        // Leve curvatura para claridad visual
        const mx = (x1 + x2) / 2 - uy * 14;
        const my = (y1 + y2) / 2 + ux * 14;
        return `<path d="M ${x1.toFixed(1)} ${y1.toFixed(1)} Q ${mx.toFixed(1)} ${my.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow-w)" />`;
      }).join('');

      const nodesSvg = world.nodes.map((n) => {
        const shapeEl = n.shape === 'square'
          ? `<rect x="${n.x - 19}" y="${n.y - 19}" width="38" height="38" rx="9" fill="#0b1020" stroke="${n.color}" stroke-width="3.2" />`
          : `<circle cx="${n.x}" cy="${n.y}" r="20" fill="#0b1020" stroke="${n.color}" stroke-width="3.2" />`;
        return `
          <g>
            ${shapeEl}
            <text x="${n.x}" y="${n.y + 5}" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="16" font-weight="900">${n.id}</text>
          </g>`;
      }).join('');

      return `
        <svg viewBox="0 0 300 195" style="width:100%;height:auto;max-height:195px;background:#060913;border:1px solid var(--border-hi);border-radius:16px;display:block">
          <defs>
            <marker id="arrow-w" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="#22d3ee" />
            </marker>
          </defs>
          ${edgesSvg}
          ${nodesSvg}
        </svg>`;
    }

    function renderForge() {
      const f = State.forge;
      if (!f) return '';

      if (f.done) {

      return `

              <div class="xs tc">${esc(ch.legend)}</div>` : ''}

            <div class="${ch.kind === 'world' ? 'grid2' : 'flex col g8'}" style="margin-top:4px">
              ${ch.options.map((o) => {
                let st = '';

                  if (o.ok) st = 'border-color:var(--close);background:var(--close-bg)';

                return `
                  <button class="row-btn btn ${ch.kind === 'world' ? 'jcc' : ''}" style="${st}" onclick="pickForgeOption('${o.id}')" ${f.answered ? 'disabled' : ''}>
                    <span class="${ch.kind === 'formal' ? 'mono' : ''}" style="font-size:13.5px;font-weight:800">${esc(o.text)}</span>

            ${f.answered ? `

                ${f.isRight ? '✅ ¡Correcto! ' : '❌ Casi: '}${esc(ch.exp)}

                      <div class="mono xs" style="color:#f8fafc;margin-top:3px">↓ φ(c cualquiera)</div>
                    </div>
                    <div style="background:#060913;border-radius:11px;padding:9px;text-align:center">
                      <div class="mono" style="font-size:13px;font-weight:900;color:#6ee7b7">¬∃x φ(x)</div>
                      <div class="mono xs" style="color:#f8fafc;margin-top:3px">↓ ¬φ(c cualquiera)</div>
                    </div>
                  </div>
                  <div class="xs" style="margin-top:7px;color:#d1fae5">Elige constantes <strong>ya activas</strong> en la rama para buscar cierres. Puedes volver a usarla con nuevas constantes.</div>
                </div>

                <div class="card">
                  <div class="xs" style="font-weight:800;color:#cbd5e1;margin-bottom:6px">RESUMEN PROPOSICIONAL (α y β)</div>
                  <div class="grid2">
                    <div class="mono xs" style="background:var(--alpha-bg);border:1px solid var(--alpha-bd);border-radius:10px;padding:8px;color:#cffafe">
                      <strong>α (Apilan ↓)</strong><br/>A∧B → A, B<br/>¬(A∨B) → ¬A, ¬B<br/>¬(A→B) → A, ¬B<br/>¬¬A → A
                    </div>
                    <div class="mono xs" style="background:var(--beta-bg);border:1px solid var(--beta-bd);border-radius:10px;padding:8px;color:#ede9fe">
                      <strong>β (Bifurcan |)</strong><br/>A∨B → A | B<br/>A→B → ¬A | B<br/>¬(A∧B) → ¬A | ¬B<br/>A↔B → A,B | ¬A,¬B
                    </div>
                  </div>
                </div>` : ''}

              ${tab === 'strat' ? `
                <div class="card" style="border-color:var(--alpha-bd)">
                  <span class="badge b-alpha">Orden Óptimo de Expansión</span>
                  <div class="mono tc" style="font-size:16px;font-weight:900;margin:8px 0;color:#f8fafc">
                    <span style="color:#22d3ee">α</span> → <span style="color:#f59e0b">δ</span> → <span style="color:#10b981">γ</span> → <span style="color:#a78bfa">β</span>
                  </div>
                  <div class="small">Apila siempre las lineales (<strong>α</strong>) y saca las existenciales (<strong>δ</strong>) antes de instanciar universales (<strong>γ</strong>) y abrir ramas (<strong>β</strong>).</div>
                </div>
                <div class="card">
                  <div style="font-weight:800;font-size:13px;color:#fcd34d;margin-bottom:4px">¿Por qué δ exige constante nueva?</div>
                  <div class="small">Si sabes que "alguien es médico" (<span class="mono">∃x P(x)</span>) y "alguien es músico" (<span class="mono">∃x Q(x)</span>), no puedes asumir que sean la misma persona. Por eso van a <span class="mono">a</span> y <span class="mono">b</span>.</div>
                </div>
                <div class="card">
                  <div style="font-weight:800;font-size:13px;color:#6ee7b7;margin-bottom:4px">¿Por qué γ se puede reutilizar (∞)?</div>
                  <div class="small">Una regla universal se cumple para <strong>todo</strong> el universo: si más tarde aparece una constante nueva <span class="mono">b</span>, debes poder aplicar tu <span class="mono">∀</span> también sobre <span class="mono">b</span>.</div>
                </div>` : ''}

              ${tab === 'exam' ? `
                <div class="card">
                  <span class="badge b-beta">Fase 0 · Qué poner en la raíz</span>
                  <div class="flex col g6" style="margin-top:8px;font-size:12.5px">
                    <div>• <strong>Validez (A):</strong> raíz <span class="mono">{ ¬A }</span> → Si todo cierra (×), ES válida.</div>
                    <div>• <strong>Consecuencia (Γ ⊨ φ):</strong> raíz <span class="mono">{ Γ, ¬φ }</span> → Si todo cierra (×), SÍ es consecuencia.</div>
                    <div>• <strong>Equivalencia (A ≡ B):</strong> raíz <span class="mono">{ ¬(A ↔ B) }</span> → Si todo cierra (×), SON equivalentes.</div>
                    <div>• <strong>Satisfacibilidad (Γ):</strong> raíz <span class="mono">{ Γ }</span> sin negar → Si queda 1 rama abierta saturada, ES satisfacible.</div>
                  </div>
                </div>
                <div class="card" style="border-color:var(--delta-bd)">
                  <div style="font-weight:800;font-size:13px;color:#fcd34d;margin-bottom:5px">Trucos estrella de Preguntas 6–10</div>
                  <div class="flex col g6 small" style="color:#e2e8f0">
                    <div>1. <strong>Todos los A son B:</strong> siempre <span class="mono">∀x(A(x) → B(x))</span>.</div>
                    <div>2. <strong>Algún A es B:</strong> siempre <span class="mono">∃x(A(x) ∧ B(x))</span>.</div>
                    <div>3. <strong>Cuantificadores cruzados:</strong> <span class="mono">∃x ∀y R(x,y) ⊨ ∀y ∃x R(x,y)</span> es VÁLIDA, pero la inversa NO.</div>
                    <div>4. <strong>Rama abierta saturada:</strong> te regala el contramodelo finito con las constantes de esa rama.</div>
                  </div>
                </div>` : ''}
            </div>
          </div>
        </div>`;
    }

    /* =========================================================================
       15. RENDER PRINCIPAL
       ========================================================================= */
    function render() {
      let body = '';
      if (State.screen === 'home') body = renderHome();
      else if (State.screen === 'academy-quiz') body = renderAcademyQuiz();
      else if (State.screen === 'play') body = renderPlay();
      else if (State.screen === 'forge') body = renderForge();

      const toastHtml = State.toast
        ? `<div class="toast-wrap"><div class="toast-box t-${State.toast.type}">${esc(State.toast.text)}</div></div>`
        : '';

      document.getElementById('app').innerHTML = `
        ${renderHeader()}
        ${body}
        ${renderGrimorioModal()}
        ${toastHtml}`;
    }

    // Arranque inicial seguro
    window.addEventListener('DOMContentLoaded', () => { render(); });
  </script>
</body>
</html>
