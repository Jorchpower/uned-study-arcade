  <style>
    /* =========================================================================
       1. TOKENS DE DISEÑO "FINAL BOSS" (#090d1a)
       ========================================================================= */
    :root {
      --bg-outer: #040711;
      --bg-app: #090d1a;
      --card: rgba(15, 23, 42, 0.86);
      --card-solid: #11182c;
      --border: #1e293b;
      --border-hi: #334155;

      --text: #f1f5f9;
      --muted: #94a3b8;
      --dim: #64748b;

      /* Paleta de acentos */
      --gold: #f59e0b;
      --gold-lt: #fcd34d;
      --gold-bg: rgba(245, 158, 11, 0.14);
      --gold-bd: rgba(245, 158, 11, 0.48);

      --cyan: #22d3ee;
      --cyan-lt: #67e8f9;
      --cyan-bg: rgba(34, 211, 238, 0.13);
      --cyan-bd: rgba(34, 211, 238, 0.45);

      --violet: #a78bfa;
      --violet-lt: #ddd6fe;
      --violet-bg: rgba(167, 139, 250, 0.14);
      --violet-bd: rgba(167, 139, 250, 0.48);

      --ok: #10b981;
      --ok-lt: #6ee7b7;
      --ok-bg: rgba(16, 185, 129, 0.15);
      --ok-bd: rgba(16, 185, 129, 0.52);

      --err: #f43f5e;
      --err-lt: #fda4af;
      --err-bg: rgba(244, 63, 94, 0.15);
      --err-bd: rgba(244, 63, 94, 0.52);

      --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0; padding: 0;
      background: var(--bg-outer);
      color: var(--text);
      font-family: var(--font);
      overscroll-behavior: none;
      line-height: 1.45;
    }

    body {
      background-image:
        radial-gradient(circle at 18% 8%, rgba(245, 158, 11, 0.12), transparent 36%),
        radial-gradient(circle at 86% 18%, rgba(34, 211, 238, 0.09), transparent 38%),
        radial-gradient(circle at 50% 92%, rgba(167, 139, 250, 0.10), transparent 42%);
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      margin: 0 auto;
      background: var(--bg-app);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 560px) {
      body {
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh; padding: 14px;
      }
      .app-shell {
        height: min(890px, calc(100vh - 28px));
        border-radius: 30px;
        border: 1px solid rgba(245, 158, 11, 0.24);
        box-shadow:
          0 32px 96px -14px rgba(0, 0, 0, 0.94),
          0 0 70px -24px rgba(245, 158, 11, 0.22);
      }
    }

    .scroll-y { overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .scroll-y::-webkit-scrollbar, .scroll-x::-webkit-scrollbar { width: 5px; height: 4px; }
    .scroll-y::-webkit-scrollbar-thumb, .scroll-x::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.45); border-radius: 99px;
    }

    button, a { font-family: inherit; color: inherit; text-decoration: none; background: none; border: none; cursor: pointer; padding: 0; }
    .btn { transition: transform 0.11s ease, border-color 0.14s ease, background 0.14s ease, opacity 0.14s ease; user-select: none; }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled { opacity: 0.42; cursor: not-allowed; }
    .mono { font-family: var(--mono); letter-spacing: -0.02em; }

    /* Cabecera fija */
    .topbar {
      padding: 10px 12px;
      background: linear-gradient(180deg, rgba(13, 19, 38, 0.98), rgba(9, 13, 26, 0.96));
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      flex-shrink: 0; z-index: 25;
    }
    .icon-btn {
      height: 36px; min-width: 36px; padding: 0 10px;
      border-radius: 11px;
      background: rgba(24, 34, 58, 0.9);
      border: 1px solid var(--border-hi);
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      font-size: 12px; font-weight: 800; color: #e2e8f0; flex-shrink: 0;
    }
    .icon-btn.manual {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(167, 139, 250, 0.16));
      border-color: var(--gold-bd); color: var(--gold-lt);
    }
    .icon-btn.locked {
      background: rgba(15, 23, 42, 0.7);
      border-color: var(--border); color: var(--dim);
    }

    /* Contenedores & Tarjetas */
    .pad { flex: 1; padding: 13px; display: flex; flex-direction: column; gap: 11px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 13px;
    }
    .boss-hero {
      border-radius: 20px; padding: 15px;
      background: linear-gradient(145deg, rgba(245, 158, 11, 0.16), rgba(15, 23, 42, 0.95) 48%, rgba(167, 139, 250, 0.14));
      border: 1px solid var(--gold-bd);
      box-shadow: 0 14px 36px -18px rgba(245, 158, 11, 0.35);
    }
    .mode-card {
      width: 100%; text-align: left;
      border-radius: 18px; padding: 14px;
      border: 1px solid var(--border);
      background: linear-gradient(155deg, rgba(20, 29, 54, 0.9), rgba(11, 16, 32, 0.96));
      display: flex; flex-direction: column; gap: 7px;
      position: relative;
    }
    .mode-card.m-gold { border-color: var(--gold-bd); background: linear-gradient(150deg, rgba(64, 37, 8, 0.45), rgba(11, 16, 32, 0.96)); }
    .mode-card.m-cyan { border-color: var(--cyan-bd); background: linear-gradient(150deg, rgba(8, 51, 68, 0.42), rgba(11, 16, 32, 0.96)); }
    .mode-card.m-violet { border-color: var(--violet-bd); background: linear-gradient(150deg, rgba(46, 16, 101, 0.42), rgba(11, 16, 32, 0.96)); }
    .mode-card.m-ok { border-color: var(--ok-bd); background: linear-gradient(150deg, rgba(6, 78, 59, 0.38), rgba(11, 16, 32, 0.96)); }

    /* Badges */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 8px; border-radius: 99px;
      font-size: 10px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase;
      border: 1px solid transparent; white-space: nowrap;
    }
    .b-gold { background: var(--gold-bg); border-color: var(--gold-bd); color: var(--gold-lt); }
    .b-cyan { background: var(--cyan-bg); border-color: var(--cyan-bd); color: var(--cyan-lt); }
    .b-violet { background: var(--violet-bg); border-color: var(--violet-bd); color: var(--violet-lt); }
    .b-ok { background: var(--ok-bg); border-color: var(--ok-bd); color: var(--ok-lt); }
    .b-err { background: var(--err-bg); border-color: var(--err-bd); color: var(--err-lt); }
    .b-dim { background: rgba(30, 41, 59, 0.8); border-color: var(--border-hi); color: var(--muted); }

    /* Botones CTA */
    .cta {
      width: 100%; padding: 12px 14px; border-radius: 14px;
      font-weight: 800; font-size: 13px;
      display: flex; align-items: center; justify-content: center; gap: 7px; text-align: center;
    }
    .cta-gold { background: linear-gradient(90deg, #f59e0b, #fbbf24); color: #1a0d02; }
    .cta-cyan { background: linear-gradient(90deg, #06b6d4, #22d3ee); color: #031921; }
    .cta-violet { background: linear-gradient(90deg, #8b5cf6, #a78bfa); color: #0e0620; }
    .cta-ok { background: linear-gradient(90deg, #10b981, #34d399); color: #031d15; }
    .cta-err { background: linear-gradient(90deg, #e11d48, #f43f5e); color: #fff1f2; }
    .cta-ghost { background: rgba(30, 41, 59, 0.85); border: 1px solid var(--border-hi); color: #e2e8f0; }

    /* Barra de navegación rápida P1..P10 */
    .qnav {
      padding: 7px 10px;
      background: rgba(11, 16, 32, 0.96);
      border-bottom: 1px solid var(--border);
      display: flex; gap: 5px; overflow-x: auto; flex-shrink: 0;
    }
    .qpill {
      min-width: 38px; height: 30px; padding: 0 7px;
      border-radius: 9px; font-family: var(--mono); font-size: 11px; font-weight: 800;
      background: #131c33; border: 1px solid var(--border-hi); color: var(--muted);
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .qpill.p-prop { border-bottom: 2px solid var(--cyan); }
    .qpill.p-pred { border-bottom: 2px solid var(--violet); }
    .qpill.answered { background: rgba(245, 158, 11, 0.22); border-color: var(--gold); color: var(--gold-lt); }
    .qpill.res-ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok-lt); }
    .qpill.res-err { background: var(--err-bg); border-color: var(--err); color: var(--err-lt); }
    .qpill.active {
      background: #f8fafc; color: #090d1a; border-color: #f8fafc;
      box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.65);
    }

    /* Tarjeta Sticky Colapsable de Datos (Pizarra V/F táctil) */
    .data-panel {
      background: linear-gradient(180deg, #10182f, #0c1224);
      border-bottom: 1px solid var(--border-hi);
      flex-shrink: 0; z-index: 15;
    }
    .data-head {
      padding: 8px 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .data-body {
      padding: 0 11px 10px;
      display: flex; flex-direction: column; gap: 5px;
      max-height: 215px; overflow-y: auto;
    }
    .f-row {
      display: flex; align-items: center; gap: 8px;
      background: rgba(9, 13, 26, 0.78);
      border: 1px solid var(--border);
      border-radius: 10px; padding: 5px 8px;
    }
    .f-row.m-v { border-color: var(--ok-bd); background: rgba(16, 185, 129, 0.10); }
    .f-row.m-f { border-color: var(--err-bd); background: rgba(244, 63, 94, 0.10); }
    .f-row.m-x { opacity: 0.45; }
    .f-row.m-x .f-expr { text-decoration: line-through; }

    .f-tag {
      font-family: var(--mono); font-size: 11px; font-weight: 900;
      min-width: 24px; flex-shrink: 0;
    }
    .f-expr {
      font-family: var(--mono); font-size: 11.8px; font-weight: 600;
      color: #e2e8f0; flex: 1; word-break: break-word; line-height: 1.3;
    }
    .vf-btn {
      width: 30px; height: 26px; border-radius: 8px; flex-shrink: 0;
      font-family: var(--mono); font-size: 12px; font-weight: 900;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--border-hi); background: #162038; color: var(--muted);
    }
    .vf-btn.st-1 { background: var(--ok-bg); border-color: var(--ok); color: var(--ok-lt); }
    .vf-btn.st-2 { background: var(--err-bg); border-color: var(--err); color: var(--err-lt); }
    .vf-btn.st-3 { background: rgba(71, 85, 105, 0.35); border-color: #64748b; color: #cbd5e1; }

    .interp-box {
      border-radius: 10px; padding: 6px 9px;
      background: rgba(9, 13, 26, 0.72);
      border: 1px solid var(--border);
      font-family: var(--mono); font-size: 11.2px; color: #cbd5e1;
      line-height: 1.38;
    }
    .interp-box.hi {
      background: rgba(167, 139, 250, 0.15);
      border-color: var(--violet);
      color: #f5f3ff;
      box-shadow: 0 0 14px -6px rgba(167, 139, 250, 0.55);
    }

    /* Opciones de respuesta (a, b, c) */
    .opt-btn {
      width: 100%; text-align: left;
      background: rgba(17, 24, 44, 0.92);
      border: 1.5px solid var(--border-hi);
      border-radius: 14px; padding: 12px;
      display: flex; align-items: center; gap: 10px;
    }
    .opt-btn:hover:not(:disabled) { border-color: var(--gold-bd); }
    .opt-btn.selected {
      background: rgba(245, 158, 11, 0.16);
      border-color: var(--gold);
      box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.4);
    }
    .opt-btn.correct { background: var(--ok-bg); border-color: var(--ok); }
    .opt-btn.wrong { background: var(--err-bg); border-color: var(--err); }
    .opt-btn.eliminated { opacity: 0.32; pointer-events: none; }
    .opt-btn.eliminated .opt-txt { text-decoration: line-through; }

    .opt-letter {
      width: 28px; height: 28px; border-radius: 9px; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-size: 12.5px; font-weight: 900;
      background: #090d1a; border: 1px solid var(--border-hi); color: var(--muted);
    }
    .opt-btn.selected .opt-letter { background: var(--gold); color: #160a01; border-color: var(--gold); }
    .opt-btn.correct .opt-letter { background: var(--ok); color: #031a12; border-color: var(--ok); }
    .opt-btn.wrong .opt-letter { background: var(--err); color: #fff; border-color: var(--err); }
    .opt-txt { font-family: var(--mono); font-size: 13.2px; font-weight: 700; word-break: break-word; line-height: 1.35; flex: 1; }

    /* Barra inferior fija */
    .footbar {
      padding: 9px 11px;
      background: rgba(9, 13, 26, 0.98);
      border-top: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 7px;
      flex-shrink: 0; z-index: 20;
    }

    /* Enlaces a Temporadas 1 y 2 */
    .season-bar {
      padding: 8px 12px;
      background: rgba(7, 10, 22, 0.96);
      border-top: 1px solid var(--border);
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      flex-shrink: 0;
    }
    .season-link {
      padding: 9px 8px; border-radius: 12px;
      font-size: 11.2px; font-weight: 800; text-align: center;
      background: rgba(17, 24, 44, 0.9); border: 1px solid var(--border-hi);
      display: flex; align-items: center; justify-content: center; gap: 5px;
    }
    .season-link.t1 { color: var(--cyan-lt); border-color: rgba(34, 211, 238, 0.3); }
    .season-link.t2 { color: var(--violet-lt); border-color: rgba(167, 139, 250, 0.3); }

    /* Tabs, Modales, Barras y Toast */
    .tabs {
      display: grid; gap: 5px;
      background: #060913; padding: 4px; border-radius: 13px; border: 1px solid var(--border);
    }
    .tab-btn { padding: 8px 6px; border-radius: 9px; font-size: 11px; font-weight: 800; color: var(--muted); text-align: center; }
    .tab-btn.active { background: #1e293b; color: #f8fafc; }

    .backdrop {
      position: fixed; inset: 0; z-index: 60;
      background: rgba(3, 6, 14, 0.85);
      backdrop-filter: blur(5px);
      display: flex; align-items: flex-end; justify-content: center;
    }
    .backdrop.center { align-items: center; padding: 16px; }
    .sheet {
      width: 100%; max-width: 480px; max-height: 88vh;
      background: #0d1428; border-top: 1px solid var(--border-hi);
      border-radius: 24px 24px 0 0; padding: 15px 15px 22px;
      display: flex; flex-direction: column; overflow: hidden;
      animation: sheetUp 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .dialog {
      width: 100%; max-width: 400px; max-height: 86vh;
      background: #0d1428; border: 1px solid var(--border-hi);
      border-radius: 22px; padding: 18px; overflow-y: auto;
      animation: popIn 0.18s ease;
    }

    .toast-wrap {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      z-index: 90; width: calc(100% - 28px); max-width: 444px; pointer-events: none;
    }
    .toast-box {
      border-radius: 14px; padding: 10px 13px; font-size: 12px; font-weight: 700;
      text-align: center; border: 1px solid; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
      animation: popIn 0.18s ease;
    }
    .t-ok { background: rgba(6, 78, 59, 0.97); border-color: var(--ok); color: #dcfce7; }
    .t-err { background: rgba(136, 19, 55, 0.97); border-color: var(--err); color: #ffe4e6; }
    .t-gold { background: rgba(120, 53, 15, 0.97); border-color: var(--gold); color: #fef3c7; }
    .t-info { background: rgba(15, 23, 42, 0.97); border-color: var(--cyan); color: #cffafe; }

    .bar-track { width: 100%; height: 7px; border-radius: 99px; background: #1e293b; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 99px; transition: width 0.25s ease; }

    .medal-circle {
      width: 78px; height: 78px; border-radius: 50%; margin: 0 auto;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; font-weight: 900; font-family: var(--mono);
      border: 3px solid;
    }

    /* Tabla compacta para Manual */
    .mini-tbl { width: 100%; border-collapse: collapse; font-size: 11.5px; }
    .mini-tbl th, .mini-tbl td {
      border: 1px solid var(--border-hi); padding: 6px 7px; text-align: left;
    }
    .mini-tbl th { background: #162038; color: var(--gold-lt); font-weight: 800; }

    @keyframes popIn { 0% { opacity: 0; transform: translateY(-6px) scale(0.96); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes sheetUp { 0% { transform: translateY(100%); } 100% { transform: translateY(0); } }

    /* Utilidades */
    .flex { display: flex; }
    .col { flex-direction: column; }
    .aic { align-items: center; }
    .jcb { justify-content: space-between; }
    .jcc { justify-content: center; }
    .wrap { flex-wrap: wrap; }
    .f1 { flex: 1; }
    .min0 { min-width: 0; }
    .g4 { gap: 4px; } .g6 { gap: 6px; } .g8 { gap: 8px; } .g10 { gap: 10px; } .g12 { gap: 12px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

      let muted = false;

      function getCtx() {
        if (muted) return null;
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) ctx = new AC();
        }
        if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {});
        return ctx;
      }

      function tone(f1, dur, type = 'sine', vol = 0.055, delay = 0, f2 = null) {
        const c = getCtx();
        if (!c) return;
        try {
          const t = c.currentTime + delay;
          const osc = c.createOscillator();
          const g = c.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(f1, t);
          if (f2) osc.frequency.exponentialRampToValueAtTime(f2, t + dur);
          g.gain.setValueAtTime(0.001, t);
          g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          osc.connect(g);
          g.connect(c.destination);
          osc.start(t);
          osc.stop(t + dur + 0.02);
        } catch (_) {}
      }

      return {
        isMuted: () => muted,
        toggle: () => {
          muted = !muted;

    const STORAGE_KEY = 'tq_jefe_final_v1';

    function emptySlotStats() {
      const s = {};
      SLOTS.forEach((k) => { s[k] = { ok: 0, total: 0 }; });
      return s;
    }

    function loadSave() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const d = JSON.parse(raw);
          const mergedSlots = emptySlotStats();
          if (d.slotStats) {
            SLOTS.forEach((k) => {
              if (d.slotStats[k]) {
                mergedSlots[k] = { ok: Number(d.slotStats[k].ok) || 0, total: Number(d.slotStats[k].total) || 0 };
              }
            });
          }
          return {
            history: Array.isArray(d.history) ? d.history : [],
            bestScore5: typeof d.bestScore5 === 'number' ? d.bestScore5 : null,
            arcadeBestScore: Number(d.arcadeBestScore) || 0,
            arcadeBestStreak: Number(d.arcadeBestStreak) || 0,
            slotStats: mergedSlots,
            recentP: Array.isArray(d.recentP) ? d.recentP : [],
            recentF: Array.isArray(d.recentF) ? d.recentF : []
          };
        }
      } catch (_) {}
      return {
        history: [],
        bestScore5: null,
        arcadeBestScore: 0,
        arcadeBestStreak: 0,
        slotStats: emptySlotStats(),
        recentP: [],
        recentF: []
      };
    }

    function persistSave() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(State.save)); } catch (_) {}
    }

      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // Construye una instancia de pregunta con opciones (a, b, c) barajadas dinámicamente
    function buildQuestionItem(pack, qObj) {
      const rawOpts = shuffle([
        { text: qObj.correct, ok: true },
        { text: qObj.wrong[0], ok: false },
        { text: qObj.wrong[1], ok: false }
      ]);
      const letters = ['a', 'b', 'c'];
      const options = rawOpts.map((o, i) => ({ letter: letters[i], text: o.text, ok: o.ok }));
      return {
        uid: `${pack.id}_${qObj.slot}`,
        pack,
        slot: qObj.slot,
        prompt: qObj.prompt,
        pista1: qObj.pista1,
        pista2: qObj.pista2,
        explicacion: qObj.explicacion,
        consejo: qObj.consejo,
        options,
        selected: null,        // 'a' | 'b' | 'c' | null
        locked: false,         // true en guided/sniper/arcade tras contestar
        hintLevel: 0,          // 0..3 en guided/sniper
        wildcardBrush: false,  // true si se usó comodín brújula en oficial
        eliminatedLetter: null // letra tachada por 50/50
      };
    }

    // Selecciona un pack aleatorio evitando repetir los 2 últimos jugados
    function pickFreshPack(packs, recentList) {
      const candidates = packs.filter((p) => !recentList.includes(p.id));
      const pool = candidates.length > 0 ? candidates : packs;
      const chosen = pool[Math.floor(Math.random() * pool.length)];
      recentList.push(chosen.id);
      while (recentList.length > 2) recentList.shift();
      return chosen;
    }

    function notify(text, type = 'info', ms = 2600) {
      if (State.toastTimer) clearTimeout(State.toastTimer);
      State.toast = { text, type };
      render();
      State.toastTimer = setTimeout(() => { State.toast = null; render(); }, ms);
    }

    function clearTimer() {
      if (State.timerId) { clearInterval(State.timerId); State.timerId = null; }
    }

    function fmtClock(sec) {
      const s = Math.max(0, Math.floor(sec));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
    }

    function fmtScore(n) {
      return (Math.round(n * 100) / 100).toFixed(2);
    }

    /* =========================================================================
       5. ARRANQUE DE LOS 4 MODOS DE JUEGO
       ========================================================================= */
    function startOfficialExam() {
      clearTimer();
      Sound.click();
      const packP = pickFreshPack(PROP_PACKS, State.save.recentP);
      const packF = pickFreshPack(PRED_PACKS, State.save.recentF);
      persistSave();

      const items = [
        ...packP.questions.map((q) => buildQuestionItem(packP, q)),
        ...packF.questions.map((q) => buildQuestionItem(packF, q))
      ];

      State.marks = {};
      State.dataCollapsed = false;
      State.modal = null;
      State.session = {
        mode: 'official',
        title: 'Simulacro Oficial UNED',
        packP, packF,
        items,
        idx: 0,
        secondsLeft: 35 * 60,
        totalSeconds: 35 * 60,
        wildcardsLeft: 2,
        wildcardsUsed: 0,
        report: null,
        expandedReview: {}
      };
      State.screen = 'exam';
      startOfficialTimer();
      render();
    }

    function startGuidedExam() {
      clearTimer();
      Sound.click();
      const packP = pickFreshPack(PROP_PACKS, State.save.recentP);
      const packF = pickFreshPack(PRED_PACKS, State.save.recentF);
      persistSave();

      const items = [
        ...packP.questions.map((q) => buildQuestionItem(packP, q)),
        ...packF.questions.map((q) => buildQuestionItem(packF, q))
      ];

      State.marks = {};
      State.dataCollapsed = false;
      State.modal = null;
      State.session = {
        mode: 'guided',
        title: 'Entrenamiento Guiado',
        packP, packF,
        items,
        idx: 0,
        report: null,
        expandedReview: {}
      };
      State.screen = 'exam';
      render();
    }

    function startSniperGroup(groupId) {
      const grp = SNIPER_GROUPS.find((g) => g.id === groupId);
      if (!grp) return;
      clearTimer();
      Sound.click();

      const allPacks = [...PROP_PACKS, ...PRED_PACKS];
      const pool = [];
      allPacks.forEach((pk) => {
        pk.questions.forEach((q) => {
          if (grp.slots.includes(q.slot)) pool.push(buildQuestionItem(pk, q));
        });
      });

      State.marks = {};
      State.dataCollapsed = false;
      State.modal = null;
      State.session = {
        mode: 'sniper',
        group: grp,
        title: grp.title,
        items: shuffle(pool),
        idx: 0,
        report: null,
        expandedReview: {}
      };
      State.screen = 'exam';
      render();
    }

    function startArcade() {
      clearTimer();
      Sound.click();
      const allPacks = [...PROP_PACKS, ...PRED_PACKS];
      const deck = [];
      allPacks.forEach((pk) => {
        pk.questions.forEach((q) => deck.push({ pack: pk, q }));
      });
      const shuffledDeck = shuffle(deck);
      const first = buildQuestionItem(shuffledDeck[0].pack, shuffledDeck[0].q);

      State.marks = {};
      State.dataCollapsed = false;
      State.modal = null;
      State.session = {
        mode: 'arcade',
        deck: shuffledDeck,
        deckPos: 0,
        current: first,
        lives: 3,
        score: 0,
        streak: 0,
        bestStreakRun: 0,
        hits: 0,
        answeredCount: 0,
        secondsLeft: 60,
        timedOut: false
      };
      State.screen = 'arcade';
      startArcadeTimer();
      render();
    }

    /* =========================================================================
       6. CRONÓMETROS (ACTUALIZACIÓN DOM LIGERA SIN RE-RENDERIZAR CADA SEGUNDO)
       ========================================================================= */
    function startOfficialTimer() {
      clearTimer();
      State.timerId = setInterval(() => {
        const s = State.session;
        if (!s || State.screen !== 'exam' || s.mode !== 'official') { clearTimer(); return; }
        s.secondsLeft -= 1;
        const el = document.getElementById('official-clock');
        if (el) {
          el.textContent = `⏱ ${fmtClock(s.secondsLeft)}`;
          el.style.color = s.secondsLeft <= 300 ? '#fda4af' : '#fcd34d';
        }
        if (s.secondsLeft <= 0) {
          clearTimer();
          notify('¡Tiempo agotado! Entregando simulacro automáticamente...', 'gold', 2600);
          submitExam(true);
        }
      }, 1000);
    }

    function startArcadeTimer() {
      clearTimer();
      State.timerId = setInterval(() => {
        const s = State.session;
        if (!s || State.screen !== 'arcade' || s.current.locked) { clearTimer(); return; }
        s.secondsLeft -= 1;
        const txt = document.getElementById('arcade-clock');
        const bar = document.getElementById('arcade-bar');
        if (txt) {
          txt.textContent = `${s.secondsLeft}s`;
          txt.style.color = s.secondsLeft <= 12 ? '#fda4af' : '#67e8f9';
        }
        if (bar) {
          bar.style.width = `${Math.max(0, (s.secondsLeft / 60) * 100)}%`;
          bar.style.background = s.secondsLeft <= 12 ? '#f43f5e' : s.secondsLeft <= 25 ? '#f59e0b' : '#22d3ee';
        }
        if (s.secondsLeft <= 0) {
          clearTimer();
          handleArcadeTimeout();
        }
      }, 1000);
    }

    /* =========================================================================
       7. INTERACCIONES EN PARTIDA (OPCIONES, PIZARRA V/F, PISTAS, COMODINES)
       ========================================================================= */
    function getMarkScopeKey(item) {
      // En Simulacro y Guiado las marcas de X1..X4 o Y1..Y4 se mantienen dentro del mismo pack para ayudar en el Mega Truco
      const s = State.session;
      if (s && (s.mode === 'official' || s.mode === 'guided')) return item.pack.id;
      return item.uid;
    }

    function cycleMark(scopeKey, fKey) {
      Sound.click();
      const k = `${scopeKey}__${fKey}`;
      const cur = State.marks[k] || 0;
      State.marks[k] = (cur + 1) % 4; // 0:· -> 1:V -> 2:F -> 3:✗
      render();
    }

    function clearMarks(scopeKey) {
      Sound.click();
      Object.keys(State.marks).forEach((k) => {
        if (k.startsWith(scopeKey + '__')) delete State.marks[k];
      });
      notify('Marcas de la pizarra limpiadas', 'info', 1200);
      render();
    }

    function toggleDataPanel() {
      Sound.click();
      State.dataCollapsed = !State.dataCollapsed;
      render();
    }

    function selectExamOption(letter) {
      const s = State.session;
      if (!s) return;
      const item = s.items[s.idx];
      if (item.eliminatedLetter === letter) return;

      if (s.mode === 'official') {
        Sound.click();
        item.selected = (item.selected === letter) ? null : letter;
        render();
        return;
      }

      // En Entrenamiento Guiado y Francotirador: corrección inmediata
      if (item.locked) return;
      item.selected = letter;
      item.locked = true;
      const opt = item.options.find((o) => o.letter === letter);
      const isOk = !!(opt && opt.ok);
      recordSlotAttempt(item.slot, isOk);
      persistSave();
      isOk ? Sound.ok() : Sound.err();
      render();
    }

    function leaveBlankCurrent() {
      const s = State.session;
      if (!s || s.mode !== 'official') return;
      Sound.click();
      s.items[s.idx].selected = null;
      notify(`${s.items[s.idx].slot} dejada en blanco (0.00 pts)`, 'info', 1400);
      render();
    }

    function jumpToExamQuestion(newIdx) {
      const s = State.session;
      if (!s || newIdx < 0 || newIdx >= s.items.length) return;
      Sound.click();
      s.idx = newIdx;
      render();
    }

    // Pistas en 3 niveles para Entrenamiento Guiado y Francotirador
    function revealNextHint() {
      const s = State.session;
      if (!s || s.mode === 'official') return;
      const item = s.items[s.idx];
      if (item.locked || item.hintLevel >= 3) return;
      Sound.hint();
      item.hintLevel += 1;
      if (item.hintLevel === 3 && !item.eliminatedLetter) {
        const wrongs = item.options.filter((o) => !o.ok);
        item.eliminatedLetter = wrongs[Math.floor(Math.random() * wrongs.length)].letter;
      }
      render();
    }

    // Comodines tácticos en Simulacro Oficial (máximo 2 en todo el examen)
    function openWildcardModal() {
      const s = State.session;
      if (!s || s.mode !== 'official' || s.wildcardsLeft <= 0) return;
      Sound.click();
      State.modal = 'wildcard';
      render();
    }

    function applyOfficialWildcard(kind) {
      const s = State.session;
      if (!s || s.mode !== 'official' || s.wildcardsLeft <= 0) return;
      const item = s.items[s.idx];

      if (kind === 'brush') {
        if (item.wildcardBrush) { notify('Ya activaste la Brújula en esta pregunta.', 'gold', 1700); return; }
        item.wildcardBrush = true;
      } else if (kind === '5050') {
        if (item.eliminatedLetter) { notify('Ya descartaste una opción en esta pregunta.', 'gold', 1700); return; }
        const wrongs = item.options.filter((o) => !o.ok && o.letter !== item.selected);
        const pool = wrongs.length ? wrongs : item.options.filter((o) => !o.ok);
        const pick = pool[Math.floor(Math.random() * pool.length)];
        item.eliminatedLetter = pick.letter;
        if (item.selected === pick.letter) item.selected = null;
      }

      s.wildcardsLeft -= 1;
      s.wildcardsUsed += 1;
      State.modal = null;
      Sound.hint();
      notify(`Comodín usado (${s.wildcardsLeft}/2 restantes · -0.15 bonus maestría)`, 'gold', 2400);
      render();
    }

    /* =========================================================================
       8. ENTREGA DE EXAMEN E INFORME COMPLETO (OFICIAL, GUIADO Y FRANCOTIRADOR)
       ========================================================================= */
    function requestSubmitExam() {
      const s = State.session;
      if (!s) return;
      Sound.click();
      if (s.mode === 'official') {
        State.modal = 'confirm-submit';
        render();
      } else {
        submitExam(false);
      }
    }

    function submitExam(forcedTimeout = false) {
      clearTimer();
      State.modal = null;
      const s = State.session;
      if (!s) return;

      let hits = 0, misses = 0, blanks = 0;
      s.items.forEach((it) => {
        if (!it.selected) {
          blanks += 1;
        } else {
          const chosen = it.options.find((o) => o.letter === it.selected);
          const ok = !!(chosen && chosen.ok);
          if (ok) hits += 1;
          else misses += 1;
          // En oficial se registran al entregar; en guiado/sniper ya se registraron al contestar
          if (s.mode === 'official') recordSlotAttempt(it.slot, ok);
        }
      });

      const totalQ = s.items.length;
      const maxOfficial = totalQ * 0.5;
      const rawScore5 = Math.max(0, hits * 0.5 - misses * 0.25);
      const score10 = maxOfficial > 0 ? (rawScore5 / maxOfficial) * 10 : 0;
      const pct = maxOfficial > 0 ? (rawScore5 / maxOfficial) * 100 : 0;
      const passesDevGate = pct >= 66.66; // Umbral 66.7% (equiv. 6/9 test UNED)
      const wildcardPenalty = (s.wildcardsUsed || 0) * 0.15;
      const masteryScore10 = Math.max(0, score10 - wildcardPenalty);

      let medal = 'F', medalName = 'Suspenso', medalColor = '#f43f5e';
      if (score10 >= 9.0) { medal = 'S'; medalName = 'Matrícula de Jefe Final'; medalColor = '#fcd34d'; }
      else if (score10 >= 7.5) { medal = 'A'; medalName = 'Notable Alto UNED'; medalColor = '#34d399'; }
      else if (score10 >= 6.0) { medal = 'B'; medalName = 'Aprobado Sólido'; medalColor = '#22d3ee'; }
      else if (score10 >= 5.0) { medal = 'C'; medalName = 'Aprobado Justo'; medalColor = '#a78bfa'; }

      const elapsedSec = s.mode === 'official' ? (s.totalSeconds - Math.max(0, s.secondsLeft)) : 0;

      s.report = {
        hits, misses, blanks, totalQ,
        rawScore5, maxOfficial, score10, pct,
        passesDevGate, wildcardPenalty, masteryScore10,
        medal, medalName, medalColor,
        elapsedSec, forcedTimeout
      };

      if (s.mode === 'official') {
        const entry = {
          date: new Date().toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' }),
          score5: Number(fmtScore(rawScore5)),
          score10: Number(fmtScore(score10)),
          hits, misses, blanks, medal,
          packP: s.packP.id, packF: s.packF.id,
          wildcardsUsed: s.wildcardsUsed
        };
        State.save.history.unshift(entry);
        if (State.save.history.length > 15) State.save.history.pop();
        if (State.save.bestScore5 === null || rawScore5 > State.save.bestScore5) {
          State.save.bestScore5 = Number(fmtScore(rawScore5));
        }
        persistSave();
      }

      State.screen = 'exam-report';
      score10 >= 5 ? Sound.win() : Sound.err();
      render();
    }

    function toggleReviewItem(idx) {
      Sound.click();
      const map = State.session.expandedReview;
      map[idx] = !map[idx];
      render();
    }

    /* =========================================================================
       9. INTERACCIONES DEL MODO ARCADE (RÁFAGA ALEATORIA)
       ========================================================================= */
    function selectArcadeOption(letter) {
      const s = State.session;
      if (!s || s.current.locked) return;
      clearTimer();
      const it = s.current;
      it.selected = letter;
      it.locked = true;
      s.answeredCount += 1;

      const opt = it.options.find((o) => o.letter === letter);
      const isOk = !!(opt && opt.ok);
      recordSlotAttempt(it.slot, isOk);

      if (isOk) {
        s.hits += 1;
        s.streak += 1;
        if (s.streak > s.bestStreakRun) s.bestStreakRun = s.streak;
        const mult = Math.min(4, 1 + Math.floor(s.streak / 2));
        const pts = (100 + s.secondsLeft * 2) * mult;
        s.score += pts;
        s.streak >= 2 ? Sound.combo() : Sound.ok();
        notify(`¡Correcto! +${pts} pts ${mult > 1 ? `(Combo ×${mult})` : ''}`, 'ok', 1700);
      } else {
        s.lives -= 1;
        s.streak = 0;
        Sound.err();
        notify(`Fallo · Pierdes 1 vida (${s.lives} restantes)`, 'err', 1800);
      }

      if (s.score > State.save.arcadeBestScore) State.save.arcadeBestScore = s.score;
      if (s.bestStreakRun > State.save.arcadeBestStreak) State.save.arcadeBestStreak = s.bestStreakRun;
      persistSave();
      render();
    }

    function handleArcadeTimeout() {
      const s = State.session;
      if (!s || s.current.locked) return;
      s.current.locked = true;
      s.timedOut = true;
      s.answeredCount += 1;
      s.lives -= 1;
      s.streak = 0;
      recordSlotAttempt(s.current.slot, false);
      persistSave();
      Sound.err();
      notify('¡Tiempo agotado! Pierdes 1 vida.', 'err', 2000);
      render();
    }

    function nextArcadeQuestion() {
      const s = State.session;
      if (!s) return;
      Sound.click();
      if (s.lives <= 0) {
        State.screen = 'arcade-over';
        render();
        return;
      }
      s.deckPos += 1;
      if (s.deckPos >= s.deck.length) {
        s.deck = shuffle(s.deck);
        s.deckPos = 0;
      }
      const nextRaw = s.deck[s.deckPos];
      s.current = buildQuestionItem(nextRaw.pack, nextRaw.q);
      s.secondsLeft = 60;
      s.timedOut = false;
      State.marks = {};
      startArcadeTimer();
      render();
    }

    /* =========================================================================
       10. NAVEGACIÓN SEGURA Y MODALES
       ========================================================================= */
    function requestGoHome() {
      Sound.click();
      if (State.screen === 'exam' && State.session && State.session.mode === 'official') {
        State.modal = 'confirm-exit';
        render();
        return;
      }
      if (State.screen === 'arcade' && State.session && State.session.lives > 0 && State.session.answeredCount > 0) {
        State.modal = 'confirm-exit';
        render();
        return;
      }
      confirmGoHome();
    }

    function confirmGoHome() {
      clearTimer();
      State.modal = null;
      State.session = null;
      State.screen = 'home';
      render();
    }

    function openManual(tab = null) {
      if (State.screen === 'exam' && State.session && State.session.mode === 'official') {
        Sound.err();
        notify('🔒 Manual bloqueado durante el Simulacro Oficial. Usa un Comodín o practica en Entrenamiento Guiado.', 'gold', 2800);
        return;
      }
      Sound.click();
      if (tab) State.manualTab = tab;
      State.modal = 'manual';
      render();
    }

    function openRadar() {
      Sound.click();
      State.modal = 'radar';
      render();
    }

    function closeModal() {
      Sound.click();
      State.modal = null;
      render();
    }

    /* =========================================================================
       11. RENDERIZADO DE COMPONENTES COMPARTIDOS
       ========================================================================= */
    function getOverallAccuracy() {
      let ok = 0, tot = 0;
      SLOTS.forEach((k) => {
        ok += State.save.slotStats[k].ok;
        tot += State.save.slotStats[k].total;
      });
      return tot > 0 ? Math.round((ok / tot) * 100) : null;
    }

    function renderTopbar() {
      const isOfficialActive = State.screen === 'exam' && State.session && State.session.mode === 'official';
      let title = 'Tableau Quest · Jefe Final';
      let sub = 'Simulacro UNED (P1–P10)';
      let showBack = State.screen !== 'home';

      if (State.screen === 'sniper-menu') {
        title = 'Francotirador por Tipo';
        sub = 'Elige tu objetivo quirúrgico';
      } else if (State.screen === 'exam' && State.session) {
        title = State.session.title;
        sub = State.session.mode === 'sniper'
          ? `Ronda ${State.session.idx + 1}/${State.session.items.length}`
          : `${State.session.packP.id} + ${State.session.packF.id}`;
      } else if (State.screen === 'exam-report' && State.session) {
        title = 'Informe de Resultados';
        sub = State.session.title;
      } else if (State.screen === 'arcade') {
        title = '⚡ Ráfaga Aleatoria';
        sub = 'Modo Arcade · 60 preguntas';
      } else if (State.screen === 'arcade-over') {
        title = 'Fin de la Ráfaga';
        sub = 'Resumen Arcade';
      }

      return `
        <header class="topbar">

            <div class="min0">

              <div class="trunc xs">${esc(sub)}</div>

          </div>

            ${isOfficialActive
              ? `<button class="icon-btn locked btn" onclick="openManual()" title="Manual bloqueado en Simulacro Oficial">🔒 Manual</button>`
              : `<button class="icon-btn manual btn" onclick="openManual()">📖 Manual</button>`}
            <button class="icon-btn btn" onclick="Sound.toggle();render()" aria-label="Silenciar">${Sound.isMuted() ? '🔇' : '🔊'}</button>
          </div>
        </header>`;
    }

    // Tarjeta Sticky Colapsable de Datos con Marcador Táctil V/F
    function renderDataCard(item) {
      const pk = item.pack;
      const scope = getMarkScopeKey(item);
      const isProp = pk.kind === 'prop';
      const accent = isProp ? 'var(--cyan-lt)' : 'var(--violet-lt)';
      const badgeCls = isProp ? 'b-cyan' : 'b-violet';
      const hiI1 = item.slot === 'P6';
      const hiI2 = item.slot === 'P7';

      const markSymbols = ['·', 'V', 'F', '✗'];
      const rowClasses = ['', 'm-v', 'm-f', 'm-x'];

      // Contador rápido de marcas activas
      let markedCount = 0;
      pk.formulas.forEach((f) => {
        if ((State.marks[`${scope}__${f.key}`] || 0) > 0) markedCount++;
      });

      return `
        <section class="data-panel">
          <div class="data-head">
            <button class="flex aic g6 min0 f1 btn" style="text-align:left" onclick="toggleDataPanel()">
              <span class="badge ${badgeCls}">${isProp ? 'Prop. X1–X4' : 'Pred. Y1–Y4'}</span>
              <span class="xs trunc" style="color:#cbd5e1;font-weight:700">${esc(pk.source)} ${pk.universe ? '· ' + pk.universe : ''}</span>
              <span class="xs" style="color:${accent};font-weight:900;flex-shrink:0">${State.dataCollapsed ? '▼ Ver datos' : '▲ Plegar'}</span>
            </button>
            ${!State.dataCollapsed ? `
              <button class="btn xs" style="padding:4px 8px;border-radius:8px;background:#162038;border:1px solid var(--border-hi);color:${markedCount ? '#fcd34d' : '#94a3b8'};font-weight:800;flex-shrink:0" onclick="clearMarks('${scope}')">
                Limpiar${markedCount ? ` (${markedCount})` : ''}
              </button>` : ''}
          </div>

          ${!State.dataCollapsed ? `
            <div class="data-body scroll-y">
              ${pk.formulas.map((f) => {
                const st = State.marks[`${scope}__${f.key}`] || 0;
                return `
                  <div class="f-row ${rowClasses[st]}">

    /* =========================================================================
       13. PANTALLA DE EXAMEN (OFICIAL, ENT. GUIADO Y FRANCOTIRADOR)
       ========================================================================= */
    function renderExamScreen() {
      const s = State.session;
      const item = s.items[s.idx];
      const isOfficial = s.mode === 'official';
      const isProp = item.pack.kind === 'prop';
      const answeredCount = s.items.filter((x) => x.selected !== null).length;
      const blankCount = s.items.length - answeredCount;

      return `
        <!-- HUD de estado + Navegación P1..P10 -->
        ${isOfficial ? `
          <div style="padding:7px 12px;background:#0d1428;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0">
            <span id="official-clock" class="mono" style="font-size:13px;font-weight:900;color:${s.secondsLeft <= 300 ? '#fda4af' : '#fcd34d'}">⏱ ${fmtClock(s.secondsLeft)}</span>
            <span class="xs mono" style="color:#cbd5e1;font-weight:700">Resp: <strong style="color:#fcd34d">${answeredCount}</strong> · Blanco: <strong>${blankCount}</strong></span>
            <button class="btn" style="padding:4px 9px;border-radius:9px;background:var(--gold-bg);border:1px solid var(--gold-bd);color:var(--gold-lt);font-size:11px;font-weight:900" onclick="openWildcardModal()" ${s.wildcardsLeft <= 0 ? 'disabled' : ''}>
              🃏 ${s.wildcardsLeft}/2
            </button>
          </div>` : `
          <div style="padding:7px 12px;background:#0d1428;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0">
            <span class="badge ${s.mode === 'guided' ? 'b-ok' : 'b-violet'}">${s.mode === 'guided' ? 'Sin penalización' : 'Francotirador'}</span>
            <span class="xs mono" style="color:#cbd5e1;font-weight:700">Completadas: <strong style="color:#6ee7b7">${answeredCount}/${s.items.length}</strong></span>
          </div>`}

        <!-- Barra rápida P1..P10 -->
        <div class="qnav scroll-x">
          ${s.items.map((it, i) => {
            const pCls = it.pack.kind === 'prop' ? 'p-prop' : 'p-pred';
            let stCls = '';
            if (isOfficial) {
              if (it.selected) stCls = 'answered';
            } else if (it.locked) {
              const ch = it.options.find((o) => o.letter === it.selected);
              stCls = ch && ch.ok ? 'res-ok' : 'res-err';
            }
            const label = s.mode === 'sniper' ? `${i + 1}` : it.slot;
            return `<button class="qpill ${pCls} ${stCls} ${i === s.idx ? 'active' : ''} btn" onclick="jumpToExamQuestion(${i})">${label}</button>`;
          }).join('')}
        </div>

        <!-- Tarjeta Sticky Colapsable de Datos (X1..X4 / Y1..Y4 + Pizarra V/F) -->
        ${renderDataCard(item)}

        <!-- Área principal desplazable: Enunciado, Opciones, Pistas y Explicación -->
        <main class="pad scroll-y">
          <div class="flex aic jcb g6">
            <span class="badge ${isProp ? 'b-cyan' : 'b-violet'}">${item.slot} · ${esc(SLOT_LABELS[item.slot])}</span>
            ${isOfficial && item.selected ? `<span class="xs" style="color:var(--gold-lt);font-weight:800">Marcada: ${item.selected})</span>` : ''}
            ${isOfficial && !item.selected ? `<span class="xs">En blanco (0.00)</span>` : ''}
          </div>

          <div style="font-size:14.2px;font-weight:800;line-height:1.42;color:#f8fafc">${esc(item.prompt)}</div>

          <!-- Comodín Brújula en Simulacro Oficial -->
          ${isOfficial && item.wildcardBrush ? `
            <div class="card" style="padding:10px 12px;background:var(--gold-bg);border-color:var(--gold-bd);font-size:12.2px">
              <strong style="color:var(--gold-lt)">🧭 Comodín Brújula:</strong> ${esc(item.pista1)}
            </div>` : ''}

          <!-- Opciones a, b, c -->
          <div class="flex col g8">
            ${item.options.map((o) => {
              const isSel = item.selected === o.letter;
              const isElim = item.eliminatedLetter === o.letter;
              let cls = '';
              if (isElim) cls = 'eliminated';
              else if (!isOfficial && item.locked) {
                if (o.ok) cls = 'correct';
                else if (isSel) cls = 'wrong';
              } else if (isSel) {
                cls = 'selected';
              }
              return `
                <button class="opt-btn ${cls} btn" onclick="selectExamOption('${o.letter}')" ${(!isOfficial && item.locked) || isElim ? 'disabled' : ''}>
                  <span class="opt-letter">${o.letter})</span>
                  <span class="opt-txt">${esc(o.text)}</span>
                </button>`;
            }).join('')}
          </div>

          <!-- Sistema de Pistas en 3 Niveles (Entrenamiento Guiado y Francotirador) -->
          ${!isOfficial && !item.locked ? `
            <div class="flex col g6" style="margin-top:2px">
              <button class="cta cta-ghost btn" style="padding:10px;border-color:var(--gold-bd);color:var(--gold-lt)" onclick="revealNextHint()" ${item.hintLevel >= 3 ? 'disabled' : ''}>
                ${item.hintLevel === 0 ? '💡 Pista Nivel 1: Brújula táctica'
                  : item.hintLevel === 1 ? '🔍 Pista Nivel 2: Cálculo clave'
                  : item.hintLevel === 2 ? '✂️ Pista Nivel 3: Descarte 50/50'
                  : '✓ Las 3 pistas están activas'}
              </button>
              ${item.hintLevel >= 1 ? `<div class="card" style="padding:10px;background:var(--gold-bg);border-color:var(--gold-bd);font-size:12px"><strong style="color:var(--gold-lt)">1. Brújula:</strong> ${esc(item.pista1)}</div>` : ''}
              ${item.hintLevel >= 2 ? `<div class="card" style="padding:10px;background:var(--cyan-bg);border-color:var(--cyan-bd);font-size:12px"><strong style="color:var(--cyan-lt)">2. Cálculo clave:</strong> ${esc(item.pista2)}</div>` : ''}
              ${item.hintLevel >= 3 ? `<div class="xs" style="color:var(--ok-lt);font-weight:700">3. Descarte 50/50 aplicado: opción ${item.eliminatedLetter}) eliminada.</div>` : ''}
            </div>` : ''}

          <!-- Corrección inmediata + Consejo UNED (Guiado y Francotirador) -->
          ${!isOfficial && item.locked ? (() => {
            const ch = item.options.find((o) => o.letter === item.selected);
            const ok = !!(ch && ch.ok);
            return `
              <div class="card" style="background:${ok ? 'var(--ok-bg)' : 'var(--err-bg)'};border-color:${ok ? 'var(--ok-bd)' : 'var(--err-bd)'}">
                <div style="font-weight:900;font-size:13px;color:${ok ? 'var(--ok-lt)' : 'var(--err-lt)'};margin-bottom:5px">
                  ${ok ? '✅ ¡Respuesta correcta!' : '❌ Fallo detectado'}
                </div>
                <div style="font-size:12.4px;color:#f1f5f9">${esc(item.explicacion)}</div>
              </div>
              <div class="card" style="background:var(--gold-bg);border-color:var(--gold-bd)">
                <div style="font-weight:900;font-size:11.5px;color:var(--gold-lt);text-transform:uppercase;margin-bottom:3px">⚡ Consejo de Examen UNED</div>
                <div style="font-size:12.2px;color:#fef3c7">${esc(item.consejo)}</div>
              </div>`;
          })() : ''}
        </main>

        <!-- Barra inferior de navegación y acciones -->
        <footer class="footbar">
          ${isOfficial ? `
            <div class="grid3">
              <button class="cta cta-ghost btn" style="padding:10px" onclick="jumpToExamQuestion(${s.idx - 1})" ${s.idx === 0 ? 'disabled' : ''}>← Ant.</button>
              <button class="cta cta-ghost btn" style="padding:10px;font-size:12px" onclick="leaveBlankCurrent()" ${!item.selected ? 'disabled' : ''}>En blanco</button>
              ${s.idx + 1 < s.items.length
                ? `<button class="cta cta-cyan btn" style="padding:10px" onclick="jumpToExamQuestion(${s.idx + 1})">Sig. →</button>`
                : `<button class="cta cta-gold btn" style="padding:10px" onclick="requestSubmitExam()">Entregar</button>`}
            </div>
            <button class="cta cta-gold btn" style="padding:10px" onclick="requestSubmitExam()">
              📩 Entregar Examen (${answeredCount}/10 respondidas · ${blankCount} blanco)
            </button>` : `
            <div class="grid2">
              <button class="cta cta-ghost btn" style="padding:10px" onclick="jumpToExamQuestion(${s.idx - 1})" ${s.idx === 0 ? 'disabled' : ''}>← Anterior</button>
              ${s.idx + 1 < s.items.length
                ? `<button class="cta cta-ok btn" style="padding:10px" onclick="jumpToExamQuestion(${s.idx + 1})">Siguiente →</button>`
                : `<button class="cta cta-gold btn" style="padding:10px" onclick="requestSubmitExam()">Ver Informe Final 🏆</button>`}
            </div>`}
        </footer>`;
    }

      return `
        <div class="backdrop center" onclick="if(event.target===this)closeModal()">
          <div class="dialog tc">
            <div style="font-size:34px">📩</div>
            <h3 style="margin:5px 0 5px;font-size:17px;font-weight:900">¿Entregar Simulacro Oficial?</h3>
            <div class="sm" style="margin-bottom:12px">
              Llevas <strong style="color:var(--gold-lt)">${ans} respondidas</strong> y <strong>${blk} en blanco</strong>.<br/>
              Recuerda: acierto +0.50, fallo -0.25, blanco 0.00.
            </div>
            <div class="grid2">
              <button class="cta cta-ghost btn" onclick="closeModal()">Seguir revisando</button>
              <button class="cta cta-gold btn" onclick="submitExam(false)">Sí, Entregar</button>
            </div>
          </div>
        </div>`;
    }

    function renderConfirmExitModal() {
      return `
        <div class="backdrop center" onclick="if(event.target===this)closeModal()">
          <div class="dialog tc">
            <div style="font-size:32px">⚠️</div>
            <h3 style="margin:5px 0 5px;font-size:16.5px;font-weight:900">¿Abandonar la partida actual?</h3>
            <div class="sm" style="margin-bottom:14px">Si sales ahora perderás el progreso de este intento.</div>
            <div class="grid2">
              <button class="cta cta-ghost btn" onclick="closeModal()">Continuar</button>
              <button class="cta cta-err btn" onclick="confirmGoHome()">Salir al Inicio</button>
            </div>
          </div>
        </div>`;
    }

    /* =========================================================================
       17. RENDER PRINCIPAL
       ========================================================================= */
    function render() {
      let body = '';
      if (State.screen === 'home') body = renderHome();
      else if (State.screen === 'sniper-menu') body = renderSniperMenu();
      else if (State.screen === 'exam') body = renderExamScreen();
      else if (State.screen === 'exam-report') body = renderExamReport();
      else if (State.screen === 'arcade') body = renderArcadeScreen();
      else if (State.screen === 'arcade-over') body = renderArcadeOver();

      let modalHtml = '';
      if (State.modal === 'manual') modalHtml = renderManualModal();
      else if (State.modal === 'radar') modalHtml = renderRadarModal();
      else if (State.modal === 'wildcard') modalHtml = renderWildcardModal();
      else if (State.modal === 'confirm-submit') modalHtml = renderConfirmSubmitModal();
      else if (State.modal === 'confirm-exit') modalHtml = renderConfirmExitModal();

      const toastHtml = State.toast
        ? `<div class="toast-wrap"><div class="toast-box t-${State.toast.type}">${esc(State.toast.text)}</div></div>`
        : '';

      document.getElementById('app').innerHTML = `
        ${renderTopbar()}
        ${body}
        ${modalHtml}
        ${toastHtml}`;
    }

    window.addEventListener('DOMContentLoaded', () => { render(); });
  </script>
</body>
</html>
